<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BOA.TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:FILL@0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#0c1324',
                        surface: '#0c1324',
                        surfacePanel: '#0f172a',
                        surfaceContainer: '#191f31',
                        surfaceHigh: '#23293c',
                        surfaceHighest: '#2e3447',
                        primary: '#adc6ff',
                        primaryContainer: '#4d8eff',
                        secondary: '#c0c1ff',
                        tertiary: '#4edea3',
                        textPrimary: '#f1f5f9',
                        textSecondary: '#94a3b8',
                        textMuted: '#64748b',
                        borderMuted: '#1e293b'
                    },
                    borderRadius: { xl: '0.75rem', '2xl': '1rem' }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
        body { background: #0c1324; color: #dce1fb; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; font-feature-settings: 'liga'; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0c1324; }
        ::-webkit-scrollbar-thumb { background: #2e3447; border-radius: 10px; }
        .glass { background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
        .channel-card { transition: transform .18s ease, background .18s ease, border-color .18s ease; }
        .channel-card:hover { transform: translateY(-2px); background: #23293c; border-color: rgba(173,198,255,.25); }
        .channel-card:active { transform: scale(.97); }
        .category-btn { transition: all .2s ease; }
        .category-btn.active { background: #adc6ff; color: #0c1324; }
        .bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
        #videoPlayer { background: #000; }
        .player-glow { box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    </style>
</head>

<body class="pb-24">
    <header class="fixed top-0 left-0 right-0 z-50 h-16 glass border-b border-white/5 flex items-center justify-center px-4">
        <div class="font-extrabold tracking-[0.15em] text-primary italic text-lg">BOA.TV</div>
    </header>

    <div id="mobileSearch" class="fixed top-16 left-0 right-0 z-40 hidden glass border-b border-white/5 p-3">
        <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-textSecondary">search</span>
            <input id="searchInput" type="text" placeholder="Buscar canal..." class="w-full bg-surfacePanel border border-white/10 rounded-xl pl-11 pr-4 py-3 text-sm text-white outline-none focus:border-primary">
        </div>
    </div>

    <main id="main-content" class="pt-16 min-h-screen">
        <section id="playerSection" class="relative w-full px-4 pt-4 hidden">
            <div id="playerWrapper" class="relative w-full max-w-6xl mx-auto aspect-video bg-black rounded-2xl overflow-hidden border border-white/10 player-glow">
                <video id="videoPlayer" class="w-full h-full" controls autoplay playsinline></video>
                <div id="playerLoading" class="absolute inset-0 hidden items-center justify-center bg-black/70">
                    <div class="text-center">
                        <span class="material-symbols-outlined text-primary text-4xl animate-spin">progress_activity</span>
                        <p class="text-[10px] uppercase tracking-widest text-primary mt-3">Carregando transmissão</p>
                    </div>
                </div>
            </div>
            <div id="nowPlaying" class="w-full max-w-6xl mx-auto mt-3 bg-surfaceContainer rounded-xl border border-white/5 p-3">
                <div class="flex items-center gap-3">
                    <img id="currentLogo" src="" alt="" class="w-12 h-12 rounded-lg object-contain bg-surfacePanel border border-white/5 p-1">
                    <div class="flex-1 min-w-0">
                        <p class="text-[9px] uppercase tracking-[.15em] text-textMuted">Assistindo agora</p>
                        <h2 id="currentTitle" class="font-bold text-white truncate mt-1">Nome do Canal</h2>
                        <p id="currentCategory" class="text-[10px] text-primary mt-1">Categoria</p>
                    </div>
                    <button id="fullscreenPlayer" class="w-11 h-11 rounded-lg bg-surfaceHigh text-primary flex items-center justify-center active:scale-95 transition">
                        <span class="material-symbols-outlined">fullscreen</span>
                    </button>
                </div>
            </div>
        </section>

        <section id="channelsSection" class="mt-8 px-4">
            <div class="max-w-6xl mx-auto">
                <div class="flex items-end justify-between mb-4">
                    <div>
                        <p class="text-[9px] uppercase tracking-[.2em] font-bold text-primary">TV ao vivo</p>
                        <h2 class="text-xl font-bold text-white mt-1">Canais</h2>
                    </div>
                    <button id="clearSearch" class="hidden text-[10px] uppercase tracking-wider text-textSecondary">Limpar</button>
                </div>
                <div id="categoryContainerMain" class="flex gap-2 overflow-x-auto hide-scrollbar pb-3"></div>
                <div id="channelsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 h-20 glass border-t border-white/5 flex items-center justify-around">
        <button id="navHome" class="flex flex-col items-center justify-center gap-1 text-primary min-w-[64px]">
            <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">home</span>
            <span class="text-[9px] uppercase tracking-wider font-bold">Início</span>
        </button>
        <button id="navChannels" class="flex flex-col items-center justify-center gap-1 text-primary min-w-[64px]">
            <span class="material-symbols-outlined">live_tv</span>
            <span class="text-[9px] uppercase tracking-wider font-bold">Canais</span>
            <span id="navChannelsIndicator" class="w-1 h-1 rounded-full bg-primary"></span>
        </button>
        <button id="navSearch" class="flex flex-col items-center justify-center gap-1 text-textSecondary min-w-[64px]">
            <span class="material-symbols-outlined">search</span>
            <span class="text-[9px] uppercase tracking-wider font-bold">Buscar</span>
        </button>
        <button id="navSettings" class="flex flex-col items-center justify-center gap-1 text-textSecondary min-w-[64px]">
            <span class="material-symbols-outlined">settings</span>
            <span class="text-[9px] uppercase tracking-wider font-bold">Config</span>
        </button>
    </nav>

    <script>
        let channelData = {}, currentActiveCategory = "ALL", searchQuery = "", hlsInstance = null;
        async function loadChannelData() {
            try {
                const response = await fetch('https://boatvapp.github.io/canais.json');
                // const response = await fetch('canais.json');
                channelData = await response.json();
                renderCategories(); renderChannels();
            } catch (error) { console.error(error); }
        }
        function getLogoFromLink(link) {
            try {
                const url = new URL(link, window.location.href);
                const img = url.searchParams.get('img');
                return img ? decodeURIComponent(img) : 'https://via.placeholder.com/200';
            } catch (error) { return 'https://via.placeholder.com/200'; }
        }
        function escapeHTML(v) { return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
        function renderCategories() {
            const categories = Object.keys(channelData);
            let html = `<button onclick="filterCategory('ALL')" class="category-btn flex-none px-4 py-2 rounded-full text-[10px] font-bold uppercase ${currentActiveCategory === 'ALL' ? 'active' : 'bg-surfaceHigh text-textSecondary'}">Todos</button>`;
            categories.forEach(cat => {
                html += `<button onclick="filterCategory('${escapeHTML(cat)}')" class="category-btn flex-none px-4 py-2 rounded-full text-[10px] font-bold uppercase ${currentActiveCategory === cat ? 'active' : 'bg-surfaceHigh text-textSecondary'}">${escapeHTML(cat)}</button>`;
            });
            document.getElementById('categoryContainerMain').innerHTML = html;
        }
        function renderChannels() {
            const grid = document.getElementById('channelsGrid');
            let channels = (currentActiveCategory === 'ALL') ? Object.values(channelData).flat() : (channelData[currentActiveCategory] || []);
            if (searchQuery.trim() !== '') {
                const query = searchQuery.toLowerCase();
                channels = channels.filter(c => c.nome && c.nome.toLowerCase().includes(query));
            }
            grid.innerHTML = channels.map(c => `
                <div onclick="playChannel('${escapeHTML(c.link)}', '${escapeHTML(c.nome)}', '${escapeHTML(c.categoria || '')}')" class="channel-card cursor-pointer">
                    <div class="relative aspect-square rounded-xl overflow-hidden bg-surfaceContainer border border-white/5">
                        <img src="${getLogoFromLink(c.link)}" alt="${escapeHTML(c.nome)}" loading="lazy" class="w-full h-full object-contain p-4" onerror="this.src='https://via.placeholder.com/200'">
                        <div class="absolute inset-x-0 bottom-0 p-2 bg-gradient-to-t from-black/80 to-transparent">
                            <p class="text-[10px] font-bold text-white truncate">${escapeHTML(c.nome)}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        function playChannel(link, name, categoria) {
            const playerSection = document.getElementById('playerSection');
            const video = document.getElementById('videoPlayer');
            const loading = document.getElementById('playerLoading');
            const channelsSection = document.getElementById('channelsSection');
            
            playerSection.classList.remove('hidden');
            loading.classList.remove('hidden'); loading.classList.add('flex');
            
            if (hlsInstance) hlsInstance.destroy();
            if (Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(link);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.error("Autoplay bloqueado", e));
                    loading.classList.add('hidden'); loading.classList.remove('flex');
                });
            } else {
                video.src = link;
                video.play();
                loading.classList.add('hidden'); loading.classList.remove('flex');
            }
            document.getElementById('currentTitle').textContent = name;
            document.getElementById('currentCategory').textContent = categoria;
            channelsSection.classList.add('hidden');
            playerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        function filterCategory(cat) { currentActiveCategory = cat; renderCategories(); renderChannels(); }
        document.addEventListener('DOMContentLoaded', () => { loadChannelData(); });
    </script>
</body>
</html>
