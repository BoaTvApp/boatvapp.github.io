<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>BOA.TV</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:FILL@0..1&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',

            theme: {
                extend: {
                    colors: {
                        background: '#0c1324',
                        surface: '#0c1324',
                        surfacePanel: '#0f172a',
                        surfaceContainer: '#191f31',
                        surfaceHigh: '#23293c',
                        surfaceHighest: '#2e3447',

                        primary: '#adc6ff',
                        primaryContainer: '#4d8eff',

                        secondary: '#c0c1ff',
                        tertiary: '#4edea3',

                        textPrimary: '#f1f5f9',
                        textSecondary: '#94a3b8',
                        textMuted: '#64748b',

                        borderMuted: '#1e293b'
                    },

                    borderRadius: {
                        xl: '0.75rem',
                        '2xl': '1rem'
                    }
                }
            }
        }
    </script>


    <style>
        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            background: linear-gradient(180deg, #0b1021 0%, #161720 100%) !important;
            color: #dce1fb;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Brilho Neon Azul - Canto Superior Esquerdo */
        body::before {
            content: '';
            position: fixed;
            top: -150px;
            left: -150px;
            width: 400px;
            height: 400px;
            background: #00d2ff;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            z-index: -1;
            pointer-events: none;
        }

        /* Brilho Neon Rosa/Roxo - Canto Inferior Direito */
        body::after {
            content: '';
            position: fixed;
            bottom: -150px;
            right: -150px;
            width: 400px;
            height: 400px;
            background: #ff007f;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            z-index: -1;
            pointer-events: none;
        }


        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            font-feature-settings: 'liga';
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }


        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }


        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }


        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }


        ::-webkit-scrollbar-track {
            background: #0c1324;
        }


        ::-webkit-scrollbar-thumb {
            background: #2e3447;
            border-radius: 10px;
        }


        .glass {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }


        .channel-card {
            transition:
                transform .18s ease,
                background .18s ease,
                border-color .18s ease;
        }


        .channel-card:hover {
            transform: translateY(-2px);
            background: #23293c;
            border-color: rgba(173,198,255,.25);
        }


        .channel-card:active {
            transform: scale(.97);
        }


        .bottom-nav {
            padding-bottom: env(safe-area-inset-bottom);
        }


        #videoPlayer {
            background: #000;
        }


        .player-glow {
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }

        /* Classes para o Menu Sanfona (Accordion) */
        .accordion-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .arrow {
            transition: transform 0.3s ease;
        }

    </style>

</head>


<body class="pb-24">


    <!-- ============================================================
         CABEÇALHO
         ============================================================ -->

    <header class="fixed top-0 left-0 right-0 z-50 h-16 glass border-b border-white/5 flex items-center justify-center px-4">
        
        <div class="font-extrabold tracking-[0.15em] text-primary italic text-lg flex items-center gap-3">
            
            <img src="https://boatvapp.github.io/img/ico_logo4.ico" alt="Ícone BOATV" class="w-8 h-8 rounded-full object-cover"/>

            BOA.TV
        </div>

    </header>


    <!-- ============================================================
         BUSCA
         ============================================================ -->

    <div
        id="mobileSearch"
        class="fixed top-16 left-0 right-0 z-40 hidden glass border-b border-white/5 p-3">

        <div class="relative">

            <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-textSecondary">
                search
            </span>

            <input
                id="searchInput"
                type="text"
                placeholder="Buscar canal..."
                class="w-full bg-surfacePanel border border-white/10 rounded-xl pl-11 pr-4 py-3 text-sm text-white outline-none focus:border-primary">

        </div>

    </div>


    <!-- ============================================================
         CONTEÚDO PRINCIPAL
         ============================================================ -->

    <main
        id="main-content"
        class="pt-16 min-h-screen">

        <!-- ========================================================
             PLAYER
             ======================================================== -->

        <section
            id="playerSection"
            class="relative w-full px-4 pt-4 hidden">

            <div
                id="playerWrapper"
                class="relative w-full max-w-6xl mx-auto aspect-video bg-black rounded-2xl overflow-hidden border border-white/10 player-glow">

                <iframe
                    id="videoPlayer"
                    class="w-full h-full border-0"
                    allowfullscreen
                    allow="autoplay; encrypted-media">
                </iframe>

                <div
                    id="playerLoading"
                    class="absolute inset-0 hidden items-center justify-center bg-black/70">

                    <div class="text-center">
                        <span class="material-symbols-outlined text-primary text-4xl animate-spin">
                            progress_activity
                        </span>
                        <p class="text-[10px] uppercase tracking-widest text-primary mt-3">
                            Carregando transmissão
                        </p>
                    </div>

                </div>

            </div>

            <!-- INFORMAÇÕES DO CANAL -->
            <div
                id="nowPlaying"
                class="w-full max-w-6xl mx-auto mt-3 bg-surfaceContainer rounded-xl border border-white/5 p-3">

                <div class="flex items-center gap-3">
                    <img
                        id="currentLogo"
                        src=""
                        alt=""
                        class="w-12 h-12 rounded-lg object-contain bg-surfacePanel border border-white/5 p-1">

                    <div class="flex-1 min-w-0">
                        <p class="text-[9px] uppercase tracking-[.15em] text-textMuted">
                            Assistindo agora
                        </p>
                        <h2
                            id="currentTitle"
                            class="font-bold text-white truncate mt-1">
                            Nome do Canal
                        </h2>
                        <p
                            id="currentCategory"
                            class="text-[10px] text-primary mt-1">
                            Categoria
                        </p>
                    </div>
                </div>

            </div>
            
            <!-- ====================================================
                 PROGRAMAÇÃO DO CANAL (EPG)
                 ==================================================== -->
            <div
                id="channelSchedule"
                class="w-full max-w-6xl mx-auto mt-4 bg-surfaceContainer rounded-xl border border-white/5 p-4">
                
                <h3 class="text-xs uppercase tracking-[.15em] font-bold text-textSecondary mb-3 flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">calendar_today</span>
                    Programação
                </h3>
                
                <!-- Lista de Programas renderizada via JS -->
                <div id="scheduleList" class="flex flex-col gap-2">
                    <!-- Conteúdo inserido dinamicamente -->
                </div>
                
            </div>

        </section>


        <!-- ========================================================
             LISTA DE CANAIS (MENU SANFONA)
             ======================================================== -->

        <section id="channelsSection" class="mt-8 px-4">
            <div class="max-w-7xl mx-auto">

                <!-- TÍTULO -->
                <div class="flex items-end justify-between mb-4">
                    
                    <div id="normalTitleContainer">
                        <p class="text-[9px] uppercase tracking-[.2em] font-bold text-primary">
                            TV ao vivo
                        </p>
                        <h2 class="text-xl font-bold text-white mt-1">
                            Categorias
                        </h2>
                    </div>

                    <div id="searchTitleContainer" class="hidden">
                        <p class="text-[9px] uppercase tracking-[.2em] font-bold text-primary">
                            Busca
                        </p>
                        <h2 class="text-xl font-bold text-white mt-1">
                            Resultados da busca
                        </h2>
                    </div>

                    <button
                        id="clearSearch"
                        class="hidden text-[10px] uppercase tracking-wider text-textSecondary">
                        Limpar
                    </button>
                </div>

                <!-- CONTAINER DO ACCORDION (Gera via JS) -->
                <div id="accordionContainer" class="w-full space-y-2">
                </div>

            </div>
        </section>

    </main>


    <!-- ============================================================
         BARRA INFERIOR
         ============================================================ -->

    <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 h-20 glass border-t border-white/5 flex items-center justify-around">

        <!-- INÍCIO -->
        <button
            id="navHome"
            class="flex flex-col items-center justify-center gap-1 text-primary min-w-[64px]">

            <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">
                home
            </span>
            <span class="text-[9px] uppercase tracking-wider font-bold">
                Início
            </span>
            <span class="w-1 h-1 rounded-full bg-primary">
            </span>
        </button>


        <!-- CANAIS -->
        <button
            id="navChannels"
            class="flex flex-col items-center justify-center gap-1 text-primary min-w-[64px]">

            <span class="material-symbols-outlined">
                live_tv
            </span>
            <span class="text-[9px] uppercase tracking-wider font-bold">
                Canais
            </span>
            <span id="navChannelsIndicator" class="w-1 h-1 rounded-full bg-primary">
            </span>
        </button>


        <!-- BUSCAR -->
        <button
            id="navSearch"
            class="flex flex-col items-center justify-center gap-1 text-textSecondary min-w-[64px]">

            <span class="material-symbols-outlined">
                search
            </span>
            <span class="text-[9px] uppercase tracking-wider font-bold">
                Buscar
            </span>
            <span class="w-1 h-1 rounded-full bg-primary opacity-0">
            </span>
        </button>


        <!-- CONFIGURAÇÕES -->
        <button
            id="navSettings"
            class="flex flex-col items-center justify-center gap-1 text-textSecondary min-w-[64px]">

            <span class="material-symbols-outlined">
                settings
            </span>
            <span class="text-[9px] uppercase tracking-wider font-bold">
                Config
            </span>
            <span class="w-1 h-1 rounded-full bg-primary opacity-0">
            </span>
        </button>

    </nav>


    <!-- ============================================================
         JAVASCRIPT
         ============================================================ -->

    <script>

        let channelData = {};
        let searchQuery = "";
        let isSearchMode = false;


        /* ============================================================
           CARREGAR CANAIS
           ============================================================ */

        async function loadChannelData() {
            const container = document.getElementById('accordionContainer');
            container.innerHTML = `
                <div class="text-center py-12 text-primary">
                    <span class="material-symbols-outlined text-3xl animate-spin mb-3">progress_activity</span>
                    <p class="text-xs font-bold tracking-wider uppercase">Carregando canais...</p>
                </div>
            `;

            try {
                // Carrega do link oficial do seu JSON
                const response = await fetch('https://boatvapp.github.io/canais.json');

                if (!response.ok) {
                    throw new Error('Erro ao carregar canais.json');
                }

                channelData = await response.json();
                renderAccordion();

            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-400">
                        <span class="material-symbols-outlined text-3xl mb-3">error</span>
                        <p class="text-sm font-semibold">Erro ao carregar canais</p>
                        <p class="text-[10px] text-textMuted mt-2">Verifique se o arquivo canais.json está disponível.</p>
                    </div>
                `;
            }
        }
    
    
        /* ============================================================
           LOGO
           ============================================================ */
    
        function getLogoFromLink(link) {
            try {
                const url = new URL(link, window.location.href);
                const img = url.searchParams.get('img');
                if (img) {
                    return decodeURIComponent(img);
                }
                return 'https://via.placeholder.com/200';
            } catch (error) {
                return 'https://via.placeholder.com/200';
            }
        }


        /* ============================================================
           ESCAPAR HTML
           ============================================================ */

        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeAttribute(value) {
            return escapeHTML(value);
        }

        function escapeJS(value) {
            return String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n');
        }


        /* ============================================================
           RENDERIZAR ACCORDION DE CANAIS
           ============================================================ */

        function renderAccordion() {
            const container = document.getElementById('accordionContainer');
            container.innerHTML = '';
            let totalCanaisFiltrados = 0;

            for (const categoria in channelData) {
                let channels = channelData[categoria];

                // Filtra se houver busca
                if (searchQuery.trim() !== '') {
                    const query = searchQuery.toLowerCase();
                    channels = channels.filter(channel => 
                        (channel.nome && channel.nome.toLowerCase().includes(query)) ||
                        (categoria.toLowerCase().includes(query))
                    );
                }

                // Se a categoria ficou vazia, pula para a próxima
                if (channels.length === 0) continue;
                totalCanaisFiltrados += channels.length;

                // 1. Cria o botão da categoria
                const btn = document.createElement('button');
                btn.className = 'w-full flex items-center justify-between bg-surfaceHigh hover:bg-surfaceHighest border border-white/5 px-5 py-4 rounded-xl text-white font-bold text-[13px] sm:text-sm transition-all shadow-sm group mt-3 outline-none';
                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">folder_open</span>
                        <span class="text-left">${escapeHTML(categoria)}</span>
                        <span class="px-2 py-0.5 rounded-md bg-primary/10 border border-primary/20 text-primary text-[10px] ml-2">${channels.length}</span>
                    </div>
                    <span class="material-symbols-outlined text-textSecondary arrow transition-transform duration-300">expand_more</span>
                `;

                // 2. Cria a Gaveta (Painel Sanfona)
                const panel = document.createElement('div');
                panel.className = 'accordion-panel bg-surfaceContainer border-x border-b border-white/5 rounded-b-xl mx-1 pt-6 pb-4 px-4 shadow-inner';
                
                // 3. Cria a Grid de Canais dentro da gaveta
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3';

                channels.forEach(channel => {
                    const logo = getLogoFromLink(channel.link);
                    const card = document.createElement('div');
                    card.className = 'channel-card cursor-pointer relative aspect-square rounded-xl overflow-hidden bg-surfacePanel border border-white/5 group';
                    card.onclick = () => playChannel(channel.link, channel.nome, channel.categoria);
                    
                    card.innerHTML = `
                        <img src="${escapeAttribute(logo)}" alt="${escapeAttribute(channel.nome)}" loading="lazy" class="w-full h-full object-contain p-4 group-hover:scale-105 transition-transform" onerror="this.src='https://via.placeholder.com/200'">
                        <div class="absolute inset-x-0 bottom-0 p-2 bg-gradient-to-t from-black/80 to-transparent">
                            <p class="text-[10px] font-bold text-white truncate">${escapeHTML(channel.nome)}</p>
                            <p class="text-[8px] text-white/60 truncate mt-1">${escapeHTML(channel.categoria || '')}</p>
                        </div>
                        <div class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/50 backdrop-blur-sm flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="material-symbols-outlined text-sm text-primary">play_arrow</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                panel.appendChild(grid);

                // 4. Lógica de abrir/fechar a gaveta
                btn.addEventListener('click', function() {
                    const isOpen = panel.style.maxHeight;
                    if (isOpen) {
                        panel.style.maxHeight = null;
                        btn.querySelector('.arrow').style.transform = 'rotate(0deg)';
                        btn.classList.replace('rounded-t-xl', 'rounded-xl');
                    } else {
                        panel.style.maxHeight = panel.scrollHeight + "px";
                        btn.querySelector('.arrow').style.transform = 'rotate(180deg)';
                        btn.classList.replace('rounded-xl', 'rounded-t-xl');
                    }
                });

                container.appendChild(btn);
                container.appendChild(panel);

                // Abre a gaveta automaticamente se o usuário estiver buscando algo
                if (searchQuery.trim() !== '') {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                    btn.querySelector('.arrow').style.transform = 'rotate(180deg)';
                    btn.classList.replace('rounded-xl', 'rounded-t-xl');
                }
            }

            // Exibe mensagem caso nenhum canal seja encontrado na busca
            if (totalCanaisFiltrados === 0 && searchQuery.trim() !== '') {
                container.innerHTML = `
                    <div class="text-center py-12 text-textMuted">
                        <span class="material-symbols-outlined text-3xl mb-3">search_off</span>
                        <p class="text-xs">Nenhum canal encontrado para "${escapeHTML(searchQuery)}"</p>
                    </div>
                `;
            }
        }


        /* ============================================================
           REPRODUZIR CANAL E EXIBIR PROGRAMAÇÃO
           ============================================================ */

        function playChannel(link, name, categoria) {
            
            if (isSearchMode) {
                closeSearch();
            }

            const playerSection = document.getElementById('playerSection');
            const player = document.getElementById('videoPlayer');
            const channelsSection = document.getElementById('channelsSection');
            const nowPlaying = document.getElementById('nowPlaying');
            const currentTitle = document.getElementById('currentTitle');
            const currentLogo = document.getElementById('currentLogo');
            const currentCategory = document.getElementById('currentCategory');
            const loading = document.getElementById('playerLoading');
            
            // Programação EPG
            const scheduleList = document.getElementById('scheduleList');

            playerSection.classList.remove('hidden');
            loading.classList.remove('hidden');
            loading.classList.add('flex');

            player.src = link;
            currentTitle.textContent = name;
            currentLogo.src = getLogoFromLink(link);
            currentCategory.textContent = categoria || '';

            // Lógica para encontrar a programação do canal clicado
            let foundChannel = null;
            for (const categoryKey in channelData) {
                const match = channelData[categoryKey].find(c => c.link === link && c.nome === name);
                if (match) {
                    foundChannel = match;
                    break;
                }
            }
            
            if (foundChannel && foundChannel.programacao && foundChannel.programacao.length > 0) {
                let scheduleHTML = '';
                
                foundChannel.programacao.forEach(prog => {
                    const isNow = prog.atual ? 'text-primary font-bold' : 'text-white';
                    const dot = prog.atual ? '<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>' : '';
                    
                    scheduleHTML += `
                        <div class="flex items-center gap-3 bg-surfacePanel p-3 rounded-lg border border-white/5">
                            <div class="text-xs font-mono text-textMuted w-12">${escapeHTML(prog.horario)}</div>
                            <div class="flex-1 text-sm ${isNow} truncate">${escapeHTML(prog.titulo)}</div>
                            ${dot}
                        </div>
                    `;
                });
                
                scheduleList.innerHTML = scheduleHTML;
            } else {
                scheduleList.innerHTML = `
                    <div class="text-center py-6 text-textMuted bg-surfacePanel rounded-lg border border-white/5">
                        <span class="material-symbols-outlined text-2xl mb-2 opacity-50">event_busy</span>
                        <p class="text-xs">Programação indisponível para este canal.</p>
                    </div>
                `;
            }

            nowPlaying.classList.remove('hidden');
            channelsSection.classList.add('hidden');

            updateChannelsButton();

            setTimeout(() => {
                playerSection.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }, 100);

            player.onload = function () {
                loading.classList.add('hidden');
                loading.classList.remove('flex');
            };
        }


        /* ============================================================
           MOSTRAR / OCULTAR CANAIS
           ============================================================ */

        function toggleChannelsSection() {
            const channelsSection = document.getElementById('channelsSection');
            if (!channelsSection) return;

            channelsSection.classList.toggle('hidden');
            updateChannelsButton();

            if (!channelsSection.classList.contains('hidden')) {
                setTimeout(() => {
                    channelsSection.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }, 100);
            }
        }


        /* ============================================================
           ESTADO VISUAL DO BOTÃO CANAIS
           ============================================================ */

        function updateChannelsButton() {
            const channelsSection = document.getElementById('channelsSection');
            const button = document.getElementById('navChannels');
            const indicator = document.getElementById('navChannelsIndicator');

            if (!channelsSection || !button || !indicator) return;

            const visible = !channelsSection.classList.contains('hidden');

            if (visible) {
                button.classList.remove('text-textSecondary');
                button.classList.add('text-primary');
                indicator.classList.remove('opacity-0');
                indicator.classList.add('opacity-100');
            } else {
                button.classList.remove('text-primary');
                button.classList.add('text-textSecondary');
                indicator.classList.remove('opacity-100');
                indicator.classList.add('opacity-0');
            }
        }


        /* ============================================================
           BOTÕES DA NAVEGAÇÃO INFERIOR
           ============================================================ */

        document.getElementById('navChannels').addEventListener('click', () => {
            if (isSearchMode) {
                closeSearch();
                document.getElementById('channelsSection').classList.remove('hidden');
                updateChannelsButton();
            } else {
                toggleChannelsSection();
            }
        });


        /* ============================================================
           BUSCA LÓGICA (MODOS E TRANSIÇÕES)
           ============================================================ */

        const searchInput = document.getElementById('searchInput');
        const mobileSearch = document.getElementById('mobileSearch');
        const clearSearch = document.getElementById('clearSearch');

        function toggleSearch() {
            if (isSearchMode) {
                closeSearch();
            } else {
                openSearch();
            }
        }

        function openSearch() {
            isSearchMode = true;
            
            mobileSearch.classList.remove('hidden');
            searchInput.focus();

            document.getElementById('normalTitleContainer').classList.add('hidden');
            document.getElementById('searchTitleContainer').classList.remove('hidden');

            const channelsSection = document.getElementById('channelsSection');
            channelsSection.classList.remove('hidden');

            updateChannelsButton();
            renderAccordion(); // Chama a nova função da sanfona
        }

        function closeSearch() {
            isSearchMode = false;
            
            mobileSearch.classList.add('hidden');
            
            searchInput.value = '';
            searchQuery = '';
            clearSearch.classList.add('hidden');

            document.getElementById('normalTitleContainer').classList.remove('hidden');
            document.getElementById('searchTitleContainer').classList.add('hidden');

            renderAccordion(); // Volta para a tela inicial
        }

        document.getElementById('navSearch').addEventListener('click', toggleSearch);

        searchInput.addEventListener('input', event => {
            searchQuery = event.target.value;

            if (searchQuery.trim() !== '') {
                clearSearch.classList.remove('hidden');
            } else {
                clearSearch.classList.add('hidden');
            }

            const channelsSection = document.getElementById('channelsSection');
            channelsSection.classList.remove('hidden');

            updateChannelsButton();
            renderAccordion();
        });

        clearSearch.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearch.classList.add('hidden');
            renderAccordion();
            searchInput.focus();
        });


        /* ============================================================
           INÍCIO (REDIRECIONAR)
           ============================================================ */

        document.getElementById('navHome').addEventListener('click', () => {
            window.location.href = '/';
        });


        /* ============================================================
           CONFIGURAÇÕES
           ============================================================ */

        document.getElementById('navSettings').addEventListener('click', () => {
            console.log('Configurações abertas');
        });


        /* ============================================================
           INICIALIZAÇÃO
           ============================================================ */

        window.addEventListener('DOMContentLoaded', () => {
            loadChannelData();
            updateChannelsButton();
        });

    </script>

</body>

</html>
