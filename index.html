<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>BOA.TV</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:FILL@0..1&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',

            theme: {
                extend: {
                    colors: {
                        background: '#0c1324',
                        surface: '#0c1324',
                        surfacePanel: '#0f172a',
                        surfaceContainer: '#191f31',
                        surfaceHigh: '#23293c',
                        surfaceHighest: '#2e3447',

                        primary: '#adc6ff',
                        primaryContainer: '#4d8eff',

                        secondary: '#c0c1ff',
                        tertiary: '#4edea3',

                        textPrimary: '#f1f5f9',
                        textSecondary: '#94a3b8',
                        textMuted: '#64748b',

                        borderMuted: '#1e293b'
                    },

                    borderRadius: {
                        xl: '0.75rem',
                        '2xl': '1rem'
                    }
                }
            }
        }
    </script>


    <style>
        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            background: #0c1324;
            color: #dce1fb;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }


        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            font-feature-settings: 'liga';
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }


        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }


        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }


        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }


        ::-webkit-scrollbar-track {
            background: #0c1324;
        }


        ::-webkit-scrollbar-thumb {
            background: #2e3447;
            border-radius: 10px;
        }


        .glass {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }


        .channel-card {
            transition:
                transform .18s ease,
                background .18s ease,
                border-color .18s ease;
        }


        .channel-card:hover {
            transform: translateY(-2px);
            background: #23293c;
            border-color: rgba(173,198,255,.25);
        }


        .channel-card:active {
            transform: scale(.97);
        }


        .category-btn {
            transition: all .2s ease;
        }


        .category-btn.active {
            background: #adc6ff;
            color: #0c1324;
        }


        .bottom-nav {
            padding-bottom: env(safe-area-inset-bottom);
        }


        #videoPlayer {
            background: #000;
        }


        .player-glow {
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }

    </style>

</head>


<body class="pb-24">


    <!-- ============================================================
         CABEÇALHO
         ============================================================ -->

<header class="fixed top-0 left-0 right-0 z-50 h-16 glass border-b border-white/5 flex items-center justify-center px-4">
    
    <div class="font-extrabold tracking-[0.15em] text-primary italic text-lg flex items-center gap-3">
        
        <!-- Sua imagem aqui -->
        <img src="/img/ico_logo4.ico" alt="Ícone" class="w-8 h-8 rounded-full object-cover"/>

        BOA.TV
    </div>

</header>


    <!-- ============================================================
         BUSCA
         ============================================================ -->

    <div
        id="mobileSearch"
        class="fixed top-16 left-0 right-0 z-40 hidden glass border-b border-white/5 p-3">

        <div class="relative">

            <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-textSecondary">

                search

            </span>


            <input
                id="searchInput"
                type="text"
                placeholder="Buscar canal..."
                class="w-full bg-surfacePanel border border-white/10 rounded-xl pl-11 pr-4 py-3 text-sm text-white outline-none focus:border-primary">

        </div>

    </div>


    <!-- ============================================================
         CONTEÚDO PRINCIPAL
         ============================================================ -->

    <main
        id="main-content"
        class="pt-16 min-h-screen">

        <!-- ========================================================
             PLAYER
             ======================================================== -->

        <section
            id="playerSection"
            class="relative w-full px-4 pt-4 hidden">

            <div
                id="playerWrapper"
                class="relative w-full max-w-6xl mx-auto aspect-video bg-black rounded-2xl overflow-hidden border border-white/10 player-glow">

                <!-- PLAYER -->

                <iframe
                    id="videoPlayer"
                    class="w-full h-full border-0"
                    allowfullscreen
                    allow="autoplay; encrypted-media">
                </iframe>

                <!-- LOADING -->

                <div
                    id="playerLoading"
                    class="absolute inset-0 hidden items-center justify-center bg-black/70">

                    <div class="text-center">

                        <span
                            class="material-symbols-outlined text-primary text-4xl animate-spin">

                            progress_activity

                        </span>

                        <p
                            class="text-[10px] uppercase tracking-widest text-primary mt-3">

                            Carregando transmissão

                        </p>

                    </div>

                </div>

            </div>

            <!-- ====================================================
                 INFORMAÇÕES DO CANAL
                 ==================================================== -->

            <div
                id="nowPlaying"
                class="w-full max-w-6xl mx-auto mt-3 bg-surfaceContainer rounded-xl border border-white/5 p-3">

                <div
                    class="flex items-center gap-3">

                    <img
                        id="currentLogo"
                        src=""
                        alt=""
                        class="w-12 h-12 rounded-lg object-contain bg-surfacePanel border border-white/5 p-1">

                    <div
                        class="flex-1 min-w-0">

                        <p
                            class="text-[9px] uppercase tracking-[.15em] text-textMuted">

                            Assistindo agora

                        </p>

                        <h2
                            id="currentTitle"
                            class="font-bold text-white truncate mt-1">

                            Nome do Canal

                        </h2>

                        <p
                            id="currentCategory"
                            class="text-[10px] text-primary mt-1">

                            Categoria

                        </p>

                    </div>

                </div>

            </div>

        </section>

        <!-- ========================================================
             LISTA DE CANAIS
             ======================================================== -->

        <section
            id="channelsSection"
            class="mt-8 px-4">

            <div
                class="max-w-7xl mx-auto">

                <!-- TÍTULO -->

                <div
                    class="flex items-end justify-between mb-4">

                    <div>

                        <p
                            class="text-[9px] uppercase tracking-[.2em] font-bold text-primary">

                            TV ao vivo

                        </p>

                        <h2
                            class="text-xl font-bold text-white mt-1">

                            Canais

                        </h2>

                    </div>

                    <button
                        id="clearSearch"
                        class="hidden text-[10px] uppercase tracking-wider text-textSecondary">

                        Limpar

                    </button>

                </div>

                <!-- LAYOUT COM DUAS COLUNAS (CATEGORIAS À ESQUERDA / CANAIS À DIREITA) -->
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">

                    <!-- CATEGORIAS (Esquerda) -->
                    <div
                        id="categoryContainerMain"
                        class="flex flex-col gap-2 overflow-y-auto hide-scrollbar max-h-[70vh] pr-2 lg:col-span-1">
                    </div>

                    <!-- GRID DE CANAIS (Direita) -->
                    <div
                        id="channelsGridWrapper"
                        class="lg:col-span-3 transition-all duration-300">

                        <!-- BARRA DE CATEGORIA SELECIONADA (Exibida somente quando uma categoria específica é selecionada) -->
                        <div
                            id="categoryHeaderBar"
                            class="hidden items-center justify-between mb-4 bg-surfaceContainer px-4 py-3 rounded-xl border border-white/5">

                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-primary text-lg">folder</span>
                                <span class="text-sm font-bold text-white" id="activeCategoryTitle">Categoria</span>
                            </div>

                            <button
                                onclick="filterCategory('ALL')"
                                class="text-[10px] uppercase tracking-wider text-primary font-bold flex items-center gap-1 hover:underline bg-surfaceHigh px-3 py-1.5 rounded-lg border border-white/5">

                                <span class="material-symbols-outlined text-sm">arrow_back</span>
                                Todas as categorias

                            </button>

                        </div>

                        <div
                            id="channelsGrid"
                            class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">

                        </div>
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- ============================================================
         BARRA INFERIOR
         ============================================================ -->

    <nav
        class="bottom-nav fixed bottom-0 left-0 right-0 z-50 h-20 glass border-t border-white/5 flex items-center justify-around">


        <!-- INÍCIO -->

        <button
            id="navHome"
            onclick="window.location.href='/';"
            class="flex flex-col items-center justify-center gap-1 text-primary min-w-[64px]">

            <span
                class="material-symbols-outlined"
                style="font-variation-settings:'FILL' 1;">
                home
            </span>

            <span
                class="text-[9px] uppercase tracking-wider font-bold">
                Início
            </span>

            <span
                class="w-1 h-1 rounded-full bg-primary">
            </span>
        </button>


        <!-- CANAIS -->

        <button
            id="navChannels"
            class="flex flex-col items-center justify-center gap-1 text-primary min-w-[64px]">

            <span
                class="material-symbols-outlined">

                live_tv

            </span>


            <span
                class="text-[9px] uppercase tracking-wider font-bold">

                Canais

            </span>


            <span
                id="navChannelsIndicator"
                class="w-1 h-1 rounded-full bg-primary">

            </span>

        </button>


        <!-- BUSCAR -->

        <button
            id="navSearch"
            class="flex flex-col items-center justify-center gap-1 text-textSecondary min-w-[64px]">

            <span
                class="material-symbols-outlined">

                search

            </span>


            <span
                class="text-[9px] uppercase tracking-wider font-bold">

                Buscar

            </span>


            <span
                class="w-1 h-1 rounded-full bg-primary opacity-0">

            </span>

        </button>


        <!-- CONFIGURAÇÕES -->

        <button
            id="navSettings"
            class="flex flex-col items-center justify-center gap-1 text-textSecondary min-w-[64px]">

            <span
                class="material-symbols-outlined">

                settings

            </span>


            <span
                class="text-[9px] uppercase tracking-wider font-bold">

                Config

            </span>


            <span
                class="w-1 h-1 rounded-full bg-primary opacity-0">

            </span>

        </button>

    </nav>


    <!-- ============================================================
         JAVASCRIPT
         ============================================================ -->

    <script>

        let channelData = {};

        let currentActiveCategory = "ALL";

        let searchQuery = "";


        /* ============================================================
           CARREGAR CANAIS
           ============================================================ */

        async function loadChannelData() {

            try {

                const response =
                    await fetch('https://boatvapp.github.io/canais.json');


                if (!response.ok) {

                    throw new Error(
                        'Erro ao carregar canais.json'
                    );

                }


                channelData =
                    await response.json();


                renderCategories();

                renderChannels();


            } catch (error) {

                console.error(error);


                document.getElementById(
                    'channelsGrid'
                ).innerHTML = `

                    <div
                        class="col-span-full text-center py-12 text-red-400">

                        <span
                            class="material-symbols-outlined text-3xl mb-3">

                            error

                        </span>


                        <p class="text-sm font-semibold">

                            Erro ao carregar canais

                        </p>
                
                
                        <p
                            class="text-[10px] text-textMuted mt-2">    
                
                            Verifique se o arquivo canais.json está disponível.
                
                        </p>
                
                    </div>
                
                `;
                
            }
            
        }
    
    
        /* ============================================================
           LOGO
           ============================================================ */
    
        function getLogoFromLink(link) {
            
            try {
                
                const url =
                    new URL(
                        link,
                        window.location.href
                    );


                const img =
                    url.searchParams.get('img');


                if (img) {

                    return decodeURIComponent(img);

                }


                return 'https://via.placeholder.com/200';


            } catch (error) {

                console.warn(
                    'Não foi possível obter a logo:',
                    error
                );


                return 'https://via.placeholder.com/200';

            }

        }


        /* ============================================================
           ESCAPAR HTML
           ============================================================ */

        function escapeHTML(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        function escapeAttribute(value) {

            return escapeHTML(value);

        }


        function escapeJS(value) {

            return String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n');

        }


        /* ============================================================
           CATEGORIAS
           ============================================================ */

        function renderCategories() {

            const categories =
                Object.keys(channelData);


            let html = `

                <button
                    onclick="filterCategory('ALL')"
                    class="category-btn flex-none px-4 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-wider text-left flex items-center justify-between
                    ${
                        currentActiveCategory === 'ALL'
                            ? 'active shadow-lg shadow-primary/10'
                            : 'bg-surfaceHigh text-textSecondary hover:text-white'
                    }">

                    <span>Todos</span>
                    <span class="material-symbols-outlined text-sm">chevron_right</span>

                </button>

            `;


            categories.forEach(category => {

                const active =
                    currentActiveCategory === category;


                html += `

                    <button
                        onclick="filterCategory('${escapeJS(category)}')"
                        class="category-btn flex-none px-4 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-wider text-left flex items-center justify-between
                        ${
                            active
                                ? 'active shadow-lg shadow-primary/10'
                                : 'bg-surfaceHigh text-textSecondary hover:text-white'
                        }">

                        <span class="truncate pr-2">${escapeHTML(category)}</span>
                        <span class="material-symbols-outlined text-sm flex-shrink-0">chevron_right</span>

                    </button>

                `;

            });


            document.getElementById(
                'categoryContainerMain'
            ).innerHTML = html;

        }


        /* ============================================================
           RENDERIZAR CANAIS
           ============================================================ */

        function renderChannels() {

            const grid =
                document.getElementById(
                    'channelsGrid'
                );


            let channels = [];


            if (
                currentActiveCategory === 'ALL'
            ) {

                Object.values(channelData)
                    .forEach(group => {

                        channels =
                            channels.concat(group);

                    });

            } else {

                channels =
                    channelData[
                        currentActiveCategory
                    ] || [];

            }


            /* BUSCA */

            if (
                searchQuery.trim() !== ''
            ) {

                const query =
                    searchQuery
                        .toLowerCase();


                channels =
                    channels.filter(channel => {

                        return (
                            channel.nome &&
                            channel.nome
                                .toLowerCase()
                                .includes(query)
                        );

                    });

            }


            /* NENHUM RESULTADO */

            if (
                channels.length === 0
            ) {

                grid.innerHTML = `

                    <div
                        class="col-span-full text-center py-12 text-textMuted">

                        <span
                            class="material-symbols-outlined text-3xl mb-3">

                            search_off

                        </span>


                        <p class="text-xs">

                            Nenhum canal encontrado

                        </p>

                    </div>

                `;

                return;

            }


            let html = '';


            channels.forEach(channel => {

                const logo =
                    getLogoFromLink(
                        channel.link
                    );


                html += `

                    <div
                        onclick="playChannel(
                            '${escapeJS(channel.link)}',
                            '${escapeJS(channel.nome)}',
                            '${escapeJS(channel.categoria)}'
                        )"
                        class="channel-card cursor-pointer">


                        <div
                            class="relative aspect-square rounded-xl overflow-hidden
                                   bg-surfaceContainer border border-white/5">


                            <img
                                src="${escapeAttribute(logo)}"
                                alt="${escapeAttribute(channel.nome)}"
                                loading="lazy"
                                class="w-full h-full object-contain p-4"
                                onerror="this.src='https://via.placeholder.com/200'">


                            <div
                                class="absolute inset-x-0 bottom-0 p-2
                                       bg-gradient-to-t from-black/80 to-transparent">


                                <p
                                    class="text-[10px] font-bold text-white truncate">

                                    ${escapeHTML(channel.nome)}

                                </p>


                                <p
                                    class="text-[8px] text-white/60 truncate mt-1">

                                    ${escapeHTML(channel.categoria || '')}

                                </p>

                            </div>


                            <div
                                class="absolute top-2 right-2 w-7 h-7 rounded-full
                                       bg-black/50 backdrop-blur-sm
                                       flex items-center justify-center">


                                <span
                                    class="material-symbols-outlined text-sm text-primary">

                                    play_arrow

                                </span>

                            </div>

                        </div>

                    </div>

                `;

            });


            grid.innerHTML = html;

        }


        /* ============================================================
           FILTRAR CATEGORIA (OCULTA CATEGORIAS E MOSTA APENAS OS CANAIS)
           ============================================================ */

        function filterCategory(category) {

            currentActiveCategory =
                category;


            renderCategories();

            renderChannels();


            const categoryContainer =
                document.getElementById(
                    'categoryContainerMain'
                );

            const channelsWrapper =
                document.getElementById(
                    'channelsGridWrapper'
                );

            const categoryHeaderBar =
                document.getElementById(
                    'categoryHeaderBar'
                );

            const activeCategoryTitle =
                document.getElementById(
                    'activeCategoryTitle'
                );


            if (category === 'ALL') {
                // Se 'ALL' (Todos) for selecionado, mostra a lista de categorias e retorna o grid para 3 colunas
                categoryContainer.classList.remove('hidden');
                channelsWrapper.classList.remove('lg:col-span-4');
                channelsWrapper.classList.add('lg:col-span-3');
                if (categoryHeaderBar) {
                    categoryHeaderBar.classList.remove('flex');
                    categoryHeaderBar.classList.add('hidden');
                }
            } else {
                // Se uma categoria específica for selecionada, oculta as categorias e expande o grid de canais para 100% (lg:col-span-4)
                categoryContainer.classList.add('hidden');
                channelsWrapper.classList.remove('lg:col-span-3');
                channelsWrapper.classList.add('lg:col-span-4');
                
                if (categoryHeaderBar && activeCategoryTitle) {
                    activeCategoryTitle.textContent = category;
                    categoryHeaderBar.classList.remove('hidden');
                    categoryHeaderBar.classList.add('flex');
                }
            }

            // Rola suavemente para o topo da grade de canais
            document.getElementById('channelsSection').scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });

        }


        /* ============================================================
           REPRODUZIR CANAL
           ============================================================ */

        function playChannel(
            link,
            name,
            categoria
        ) {

            const playerSection =
                document.getElementById(
                    'playerSection'
                );


            const player =
                document.getElementById(
                    'videoPlayer'
                );


            const channelsSection =
                document.getElementById(
                    'channelsSection'
                );


            const nowPlaying =
                document.getElementById(
                    'nowPlaying'
                );


            const currentTitle =
                document.getElementById(
                    'currentTitle'
                );


            const currentLogo =
                document.getElementById(
                    'currentLogo'
                );


            const currentCategory =
                document.getElementById(
                    'currentCategory'
                );


            const loading =
                document.getElementById(
                    'playerLoading'
                );


            playerSection.classList.remove(
                'hidden'
            );


            loading.classList.remove(
                'hidden'
            );


            loading.classList.add(
                'flex'
            );


            player.src =
                link;


            currentTitle.textContent =
                name;


            currentLogo.src =
                getLogoFromLink(link);


            currentCategory.textContent =
                categoria || '';


            nowPlaying.classList.remove(
                'hidden'
            );


            channelsSection.classList.add(
                'hidden'
            );


            updateChannelsButton();


            setTimeout(() => {

                playerSection.scrollIntoView({

                    behavior: 'smooth',

                    block: 'start'

                });

            }, 100);


            player.onload =
                function () {

                    loading.classList.add(
                        'hidden'
                    );


                    loading.classList.remove(
                        'flex'
                    );

                };

        }


        /* ============================================================
           MOSTRAR / OCULTAR CANAIS
           ============================================================ */

        function toggleChannelsSection() {

            const channelsSection =
                document.getElementById(
                    'channelsSection'
                );


            if (!channelsSection) {

                return;

            }


            channelsSection.classList.toggle(
                'hidden'
            );


            updateChannelsButton();


            if (
                !channelsSection
                    .classList
                    .contains('hidden')
            ) {

                setTimeout(() => {

                    channelsSection.scrollIntoView({

                        behavior: 'smooth',

                        block: 'start'

                    });

                }, 100);

            }

        }


        /* ============================================================
           ESTADO VISUAL DO BOTÃO CANAIS
           ============================================================ */

        function updateChannelsButton() {

            const channelsSection =
                document.getElementById(
                    'channelsSection'
                );


            const button =
                document.getElementById(
                    'navChannels'
                );


            const indicator =
                document.getElementById(
                    'navChannelsIndicator'
                );


            if (
                !channelsSection ||
                !button ||
                !indicator
            ) {

                return;

            }


            const visible =
                !channelsSection
                    .classList
                    .contains('hidden');


            if (visible) {

                button.classList.remove(
                    'text-textSecondary'
                );


                button.classList.add(
                    'text-primary'
                );


                indicator.classList.remove(
                    'opacity-0'
                );


                indicator.classList.add(
                    'opacity-100'
                );

            } else {

                button.classList.remove(
                    'text-primary'
                );


                button.classList.add(
                    'text-textSecondary'
                );


                indicator.classList.remove(
                    'opacity-100'
                );


                indicator.classList.add(
                    'opacity-0'
                );

            }

        }


        /* ============================================================
           BOTÃO CANAIS
           ============================================================ */

        document
            .getElementById(
                'navChannels'
            )
            .addEventListener(
                'click',
                () => {

                    toggleChannelsSection();

                }
            );


        /* ============================================================
           BUSCA
           ============================================================ */

        const searchInput =
            document.getElementById(
                'searchInput'
            );


        const mobileSearch =
            document.getElementById(
                'mobileSearch'
            );


        const clearSearch =
            document.getElementById(
                'clearSearch'
            );


        function toggleSearch() {

            mobileSearch.classList.toggle(
                'hidden'
            );


            if (
                !mobileSearch
                    .classList
                    .contains('hidden')
            ) {

                searchInput.focus();

            }

        }


        document
            .getElementById(
                'navSearch'
            )
            .addEventListener(
                'click',
                toggleSearch
            );


        searchInput.addEventListener(
            'input',
            event => {

                searchQuery =
                    event.target.value;


                if (
                    searchQuery.trim() !== ''
                ) {

                    clearSearch.classList.remove(
                        'hidden'
                    );

                } else {

                    clearSearch.classList.add(
                        'hidden'
                    );

                }


                const channelsSection =
                    document.getElementById(
                        'channelsSection'
                    );


                channelsSection.classList.remove(
                    'hidden'
                );


                updateChannelsButton();

                renderChannels();

            }
        );


        clearSearch.addEventListener(
            'click',
            () => {

                searchInput.value = '';

                searchQuery = '';


                clearSearch.classList.add(
                    'hidden'
                );

                
                renderChannels();
                
            }
        );


        /* ============================================================
           INÍCIO
           ============================================================ */

        document
            .getElementById(
                'navHome'
            )
            .addEventListener(
                'click',
                () => {

                    window.scrollTo({

                        top: 0,

                        behavior: 'smooth'

                    });

                }
            );


        /* ============================================================
           CONFIGURAÇÕES
           ============================================================ */

        document
            .getElementById(
                'navSettings'
            )
            .addEventListener(
                'click',
                () => {

                    console.log(
                        'Configurações'
                    );

                }
            );


        /* ============================================================
           INICIALIZAÇÃO
           ============================================================ */

        window.addEventListener(
            'DOMContentLoaded',
            () => {

                loadChannelData();

                updateChannelsButton();

            }
        );

    </script>

</body>

</html>
