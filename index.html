<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>BOA.TV</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:FILL@0..1&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',

            theme: {
                extend: {
                    colors: {
                        background: '#0c1324',
                        surface: '#0c1324',
                        surfacePanel: '#0f172a',
                        surfaceContainer: '#191f31',
                        surfaceHigh: '#23293c',
                        surfaceHighest: '#2e3447',

                        primary: '#adc6ff',
                        primaryContainer: '#4d8eff',

                        secondary: '#c0c1ff',
                        tertiary: '#4edea3',

                        textPrimary: '#f1f5f9',
                        textSecondary: '#94a3b8',
                        textMuted: '#64748b',

                        borderMuted: '#1e293b'
                    },

                    borderRadius: {
                        xl: '0.75rem',
                        '2xl': '1rem'
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #0c1324;
            color: #dce1fb;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            font-feature-settings: 'liga';
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #0c1324;
        }

        ::-webkit-scrollbar-thumb {
            background: #2e3447;
            border-radius: 10px;
        }

        .glass {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .channel-card {
            transition:
                transform .18s ease,
                background .18s ease,
                border-color .18s ease;
        }

        .channel-card:hover {
            transform: translateY(-2px);
            background: #23293c;
            border-color: rgba(173,198,255,.25);
        }

        .channel-card:active {
            transform: scale(.97);
        }

        .category-btn {
            transition: all .2s ease;
        }

        .category-btn.active {
            background: #adc6ff;
            color: #0c1324;
        }

        .bottom-nav {
            padding-bottom: env(safe-area-inset-bottom);
        }

        #videoPlayer {
            background: #000;
        }

        .player-glow {
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }
    </style>
</head>

<body class="pb-24">

    <!-- TOAST -->
    <div
        id="toast-container"
        class="fixed top-20 left-1/2 -translate-x-1/2 z-[100] w-[90%] max-w-sm pointer-events-none">
    </div>


    <!-- HEADER -->
    <header
        class="fixed top-0 left-0 right-0 z-50 h-16 glass border-b border-white/5 flex items-center justify-between px-4">

        <button
            id="sidebarToggle"
            class="w-11 h-11 flex items-center justify-center rounded-full text-primary active:scale-95 transition">

            <span class="material-symbols-outlined">
                menu
            </span>

        </button>


        <div
            class="font-extrabold tracking-[0.15em] text-primary italic text-lg">
            BOA.TV
        </div>


        <button
            id="searchButton"
            class="w-11 h-11 flex items-center justify-center rounded-full text-primary active:scale-95 transition">

            <span class="material-symbols-outlined">
                search
            </span>

        </button>

    </header>


    <!-- SEARCH MOBILE -->
    <div
        id="mobileSearch"
        class="fixed top-16 left-0 right-0 z-40 hidden glass border-b border-white/5 p-3">

        <div class="relative">

            <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-textSecondary">
                search
            </span>

            <input
                id="searchInput"
                type="text"
                placeholder="Buscar canal..."
                class="w-full bg-surfacePanel border border-white/10 rounded-xl pl-11 pr-4 py-3 text-sm text-white outline-none focus:border-primary">

        </div>

    </div>


    <!-- SIDEBAR -->
    <aside
        id="sidebar"
        class="fixed top-16 bottom-20 left-0 z-40 w-[300px] max-w-[85vw]
               bg-surfacePanel border-r border-white/5
               transform -translate-x-full transition-transform duration-300">

        <div class="h-full flex flex-col">

            <div class="p-4 border-b border-white/5">

                <div class="flex items-center justify-between">

                    <div>

                        <p class="text-[10px] uppercase tracking-[.2em] font-bold text-textMuted">
                            Navegação
                        </p>

                        <h2 class="text-lg font-bold text-white mt-1">
                            Canais
                        </h2>

                    </div>

                    <button
                        id="closeSidebar"
                        class="md:hidden w-10 h-10 rounded-full flex items-center justify-center text-textSecondary">

                        <span class="material-symbols-outlined">
                            close
                        </span>

                    </button>

                </div>

            </div>


            <div
                id="categoryContainer"
                class="flex gap-2 p-3 overflow-x-auto hide-scrollbar border-b border-white/5">
            </div>


            <div
                id="channelsList"
                class="flex-1 overflow-y-auto p-3 space-y-2">

                <div
                    class="flex flex-col items-center justify-center py-12 text-textMuted">

                    <span class="material-symbols-outlined text-3xl mb-3 animate-spin">
                        progress_activity
                    </span>

                    <p class="text-xs">
                        Carregando canais...
                    </p>

                </div>

            </div>

        </div>

    </aside>


    <!-- MAIN -->
    <main
        id="main-content"
        class="pt-16 min-h-screen">


        <!-- PLAYER -->
        <section
            class="relative w-full px-4 pt-4">

            <div
                id="playerWrapper"
                class="relative w-full max-w-6xl mx-auto aspect-video bg-black rounded-2xl overflow-hidden border border-white/10 player-glow">

                <div
                    id="playerPlaceholder"
                    class="absolute inset-0 flex flex-col items-center justify-center text-center p-6">

                    <div
                        class="w-20 h-20 rounded-full bg-surfaceContainer flex items-center justify-center mb-4">

                        <span
                            class="material-symbols-outlined text-4xl text-primary">
                            live_tv
                        </span>

                    </div>

                    <h1 class="text-lg font-bold text-white">
                        BOA.TV
                    </h1>

                    <p class="text-xs text-textSecondary mt-2 max-w-xs">
                        Selecione um canal para iniciar a transmissão.
                    </p>

                    <button
                        id="openChannels"
                        class="mt-5 px-5 py-3 bg-primary text-surface rounded-xl text-xs font-bold uppercase tracking-wider active:scale-95 transition">

                        Ver Canais

                    </button>

                </div>


                <iframe
                    id="videoPlayer"
                    class="w-full h-full border-0 hidden"
                    allowfullscreen
                    allow="autoplay; encrypted-media">
                </iframe>


                <div
                    id="playerLoading"
                    class="absolute inset-0 hidden items-center justify-center bg-black/70">

                    <div class="text-center">

                        <span
                            class="material-symbols-outlined text-primary text-4xl animate-spin">
                            progress_activity
                        </span>

                        <p class="text-[10px] uppercase tracking-widest text-primary mt-3">
                            Carregando transmissão
                        </p>

                    </div>

                </div>

            </div>


            <!-- NOW PLAYING -->
            <div
                id="nowPlaying"
                class="hidden w-full max-w-6xl mx-auto mt-3 bg-surfaceContainer rounded-xl border border-white/5 p-3">

                <div class="flex items-center gap-3">

                    <img
                        id="currentLogo"
                        src=""
                        alt=""
                        class="w-12 h-12 rounded-lg object-contain bg-surfacePanel border border-white/5 p-1">

                    <div class="flex-1 min-w-0">

                        <p
                            class="text-[9px] uppercase tracking-[.15em] text-textMuted">
                            Assistindo agora
                        </p>

                        <h2
                            id="currentTitle"
                            class="font-bold text-white truncate mt-1">
                            Nome do Canal
                        </h2>

                        <p
                            id="currentCategory"
                            class="text-[10px] text-primary mt-1">
                            Categoria
                        </p>

                    </div>


                    <button
                        id="fullscreenPlayer"
                        class="w-11 h-11 rounded-lg bg-surfaceHigh text-primary flex items-center justify-center active:scale-95 transition">

                        <span class="material-symbols-outlined">
                            fullscreen
                        </span>

                    </button>

                </div>

            </div>

        </section>


        <!-- LISTA DE CANAIS -->
        <!--
            Esta seção recebe o ID "channelsSection".
            Quando um canal é selecionado, ela é ocultada.
        -->
        <section
            id="channelsSection"
            class="mt-8 px-4">

            <div class="max-w-6xl mx-auto">

                <div class="flex items-end justify-between mb-4">

                    <div>

                        <p
                            class="text-[9px] uppercase tracking-[.2em] font-bold text-primary">
                            TV ao vivo
                        </p>

                        <h2
                            class="text-xl font-bold text-white mt-1">
                            Canais
                        </h2>

                    </div>

                    <button
                        id="clearSearch"
                        class="hidden text-[10px] uppercase tracking-wider text-textSecondary">
                        Limpar
                    </button>

                </div>


                <div
                    id="categoryContainerMain"
                    class="flex gap-2 overflow-x-auto hide-scrollbar pb-3">
                </div>


                <div
                    id="channelsGrid"
                    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                </div>

            </div>

        </section>

    </main>


    <!-- BOTTOM NAV -->
    <nav
        class="bottom-nav fixed bottom-0 left-0 right-0 z-50 h-20 glass border-t border-white/5 flex items-center justify-around">

        <button
            id="navHome"
            class="flex flex-col items-center justify-center gap-1 text-primary min-w-[64px]">

            <span
                class="material-symbols-outlined"
                style="font-variation-settings:'FILL' 1;">
                home
            </span>

            <span class="text-[9px] uppercase tracking-wider font-bold">
                Início
            </span>

            <span class="w-1 h-1 rounded-full bg-primary"></span>

        </button>


        <button
            id="navChannels"
            class="flex flex-col items-center justify-center gap-1 text-textSecondary min-w-[64px]">

            <span class="material-symbols-outlined">
                live_tv
            </span>

            <span class="text-[9px] uppercase tracking-wider font-bold">
                Canais
            </span>

            <span class="w-1 h-1 rounded-full bg-primary opacity-0"></span>

        </button>


        <button
            id="navSearch"
            class="flex flex-col items-center justify-center gap-1 text-textSecondary min-w-[64px]">

            <span class="material-symbols-outlined">
                search
            </span>

            <span class="text-[9px] uppercase tracking-wider font-bold">
                Buscar
            </span>

            <span class="w-1 h-1 rounded-full bg-primary opacity-0"></span>

        </button>


        <button
            id="navSettings"
            class="flex flex-col items-center justify-center gap-1 text-textSecondary min-w-[64px]">

            <span class="material-symbols-outlined">
                settings
            </span>

            <span class="text-[9px] uppercase tracking-wider font-bold">
                Config
            </span>

            <span class="w-1 h-1 rounded-full bg-primary opacity-0"></span>

        </button>

    </nav>


    <script>

        let channelData = {};

        let currentActiveCategory = "ALL";

        let searchQuery = "";


        /*
         * ============================================================
         * CARREGAR CANAIS
         * ============================================================
         */

        async function loadChannelData() {

            try {

                const response =
                    await fetch('canais.json');

                if (!response.ok) {
                    throw new Error(
                        'Erro ao carregar o arquivo canais.json'
                    );
                }

                channelData =
                    await response.json();

                renderCategories();

                renderChannels();

            } catch (error) {

                console.error(error);

                const errorHTML = `
                    <div class="text-center py-12 text-red-400">

                        <span class="material-symbols-outlined text-3xl mb-3">
                            error
                        </span>

                        <p class="text-sm font-semibold">
                            Erro ao carregar canais
                        </p>

                        <p class="text-[10px] text-textMuted mt-2">
                            Verifique se o arquivo canais.json está disponível.
                        </p>

                    </div>
                `;

                document.getElementById(
                    'channelsList'
                ).innerHTML = errorHTML;

                document.getElementById(
                    'channelsGrid'
                ).innerHTML = errorHTML;

            }

        }


        /*
         * ============================================================
         * LOGO DO CANAL
         * ============================================================
         *
         * A logo é obtida do parâmetro "img"
         * existente no link do próprio canal.
         */

        function getLogoFromLink(link) {

            try {

                const url =
                    new URL(
                        link,
                        window.location.href
                    );

                const img =
                    url.searchParams.get('img');

                if (img) {

                    return decodeURIComponent(img);

                }

                return 'https://via.placeholder.com/200';

            } catch (error) {

                console.warn(
                    'Não foi possível obter a logo pelo link:',
                    error
                );

                return 'https://via.placeholder.com/200';

            }

        }


        /*
         * ============================================================
         * ESCAPAR HTML
         * ============================================================
         */

        function escapeHTML(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        function escapeAttribute(value) {

            return escapeHTML(value);

        }


        function escapeJS(value) {

            return String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n');

        }


        /*
         * ============================================================
         * CATEGORIAS
         * ============================================================
         */

        function renderCategories() {

            const categories =
                Object.keys(channelData);

            let html = `
                <button
                    onclick="filterCategory('ALL')"
                    class="category-btn flex-none px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider
                    ${
                        currentActiveCategory === 'ALL'
                            ? 'active'
                            : 'bg-surfaceHigh text-textSecondary'
                    }">

                    Todos

                </button>
            `;


            categories.forEach(cat => {

                const isActive =
                    currentActiveCategory === cat;


                html += `

                    <button
                        onclick="filterCategory('${escapeJS(cat)}')"
                        class="category-btn flex-none px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider
                        ${
                            isActive
                                ? 'active'
                                : 'bg-surfaceHigh text-textSecondary'
                        }">

                        ${escapeHTML(cat)}

                    </button>

                `;

            });


            document.getElementById(
                'categoryContainer'
            ).innerHTML = html;


            document.getElementById(
                'categoryContainerMain'
            ).innerHTML = html;

        }


        /*
         * ============================================================
         * RENDERIZAR CANAIS
         * ============================================================
         */

        function renderChannels() {

            const listContainer =
                document.getElementById(
                    'channelsList'
                );


            const gridContainer =
                document.getElementById(
                    'channelsGrid'
                );


            let matchedChannels = [];


            if (currentActiveCategory === 'ALL') {

                Object.values(channelData)
                    .forEach(group => {

                        matchedChannels =
                            matchedChannels.concat(group);

                    });

            } else {

                matchedChannels =
                    channelData[
                        currentActiveCategory
                    ] || [];

            }


            /*
             * BUSCA
             */

            if (searchQuery.trim() !== '') {

                const query =
                    searchQuery.toLowerCase();


                matchedChannels =
                    matchedChannels.filter(ch =>
                        ch.nome &&
                        ch.nome
                            .toLowerCase()
                            .includes(query)
                    );

            }


            /*
             * NENHUM RESULTADO
             */

            if (matchedChannels.length === 0) {

                const emptyHTML = `

                    <div class="text-center py-12 text-textMuted">

                        <span class="material-symbols-outlined text-3xl mb-3">
                            search_off
                        </span>

                        <p class="text-xs">
                            Nenhum canal encontrado
                        </p>

                    </div>

                `;


                listContainer.innerHTML =
                    emptyHTML;


                gridContainer.innerHTML =
                    emptyHTML;


                return;

            }


            /*
             * SIDEBAR
             */

            let sidebarHTML = '';


            matchedChannels.forEach(ch => {

                const logo =
                    getLogoFromLink(ch.link);


                sidebarHTML += `

                    <div
                        onclick="playChannel(
                            '${escapeJS(ch.link)}',
                            '${escapeJS(ch.nome)}',
                            '${escapeJS(logo)}',
                            '${escapeJS(ch.categoria)}'
                        )"
                        class="channel-card flex items-center gap-3 p-2 rounded-xl
                               bg-surface/50 border border-white/5 cursor-pointer group">

                        <div
                            class="w-11 h-11 rounded-lg bg-surfacePanel
                                   border border-white/5 flex items-center justify-center
                                   p-1 flex-shrink-0">

                            <img
                                src="${escapeAttribute(logo)}"
                                alt=""
                                class="w-full h-full object-contain"
                                onerror="this.src='https://via.placeholder.com/80'">

                        </div>


                        <div class="flex-1 min-w-0">

                            <h4
                                class="text-xs font-semibold text-white
                                       group-hover:text-primary truncate">

                                ${escapeHTML(ch.nome)}

                            </h4>

                            <span
                                class="text-[9px] text-textMuted block truncate mt-1">

                                ${escapeHTML(ch.categoria || '')}

                            </span>

                        </div>


                        <span
                            class="material-symbols-outlined text-sm text-textMuted
                                   group-hover:text-primary">

                            play_arrow

                        </span>

                    </div>

                `;

            });


            listContainer.innerHTML =
                sidebarHTML;


            /*
             * GRID PRINCIPAL
             */

            let gridHTML = '';


            matchedChannels.forEach(ch => {

                const logo =
                    getLogoFromLink(ch.link);


                gridHTML += `

                    <div
                        onclick="playChannel(
                            '${escapeJS(ch.link)}',
                            '${escapeJS(ch.nome)}',
                            '${escapeJS(logo)}',
                            '${escapeJS(ch.categoria)}'
                        )"
                        class="channel-card cursor-pointer">

                        <div
                            class="relative aspect-square rounded-xl overflow-hidden
                                   bg-surfaceContainer border border-white/5">

                            <img
                                src="${escapeAttribute(logo)}"
                                alt="${escapeAttribute(ch.nome)}"
                                loading="lazy"
                                class="w-full h-full object-contain p-4"
                                onerror="this.src='https://via.placeholder.com/200'">


                            <div
                                class="absolute inset-x-0 bottom-0 p-2
                                       bg-gradient-to-t from-black/80 to-transparent">

                                <p
                                    class="text-[10px] font-bold text-white truncate">

                                    ${escapeHTML(ch.nome)}

                                </p>

                                <p
                                    class="text-[8px] text-white/60 truncate mt-1">

                                    ${escapeHTML(ch.categoria || '')}

                                </p>

                            </div>


                            <div
                                class="absolute top-2 right-2 w-7 h-7 rounded-full
                                       bg-black/50 backdrop-blur-sm
                                       flex items-center justify-center">

                                <span
                                    class="material-symbols-outlined text-sm text-primary">

                                    play_arrow

                                </span>

                            </div>

                        </div>

                    </div>

                `;

            });


            gridContainer.innerHTML =
                gridHTML;

        }


        /*
         * ============================================================
         * FILTRO
         * ============================================================
         */

        function filterCategory(category) {

            currentActiveCategory =
                category;

            renderCategories();

            renderChannels();

        }


        /*
         * ============================================================
         * REPRODUZIR CANAL
         * ============================================================
         */

        function playChannel(
            link,
            name,
            capa,
            categoria
        ) {

            const player =
                document.getElementById(
                    'videoPlayer'
                );


            const placeholder =
                document.getElementById(
                    'playerPlaceholder'
                );


            const nowPlaying =
                document.getElementById(
                    'nowPlaying'
                );


            const currentTitle =
                document.getElementById(
                    'currentTitle'
                );


            const currentLogo =
                document.getElementById(
                    'currentLogo'
                );


            const currentCategory =
                document.getElementById(
                    'currentCategory'
                );


            const loading =
                document.getElementById(
                    'playerLoading'
                );


            /*
             * MOSTRA O PLAYER
             */

            placeholder.classList.add(
                'hidden'
            );


            player.classList.remove(
                'hidden'
            );


            loading.classList.remove(
                'hidden'
            );


            loading.classList.add(
                'flex'
            );


            player.src =
                link;


            /*
             * INFORMAÇÕES DO CANAL
             */

            currentTitle.textContent =
                name;


            /*
             * A logo continua sendo
             * obtida pelo link.
             */

            currentLogo.src =
                getLogoFromLink(link);


            currentCategory.textContent =
                categoria;


            nowPlaying.classList.remove(
                'hidden'
            );


            /*
             * ========================================================
             * OCULTAR A LISTA DE CANAIS ABAIXO DO PLAYER
             * ========================================================
             */

            const channelsSection =
                document.getElementById(
                    'channelsSection'
                );


            if (channelsSection) {

                channelsSection.classList.add(
                    'hidden'
                );

            }


            /*
             * FECHAR SIDEBAR NO CELULAR
             */

            if (window.innerWidth < 768) {

                document
                    .getElementById(
                        'sidebar'
                    )
                    .classList.add(
                        '-translate-x-full'
                    );

            }


            /*
             * VOLTAR AO TOPO,
             * DEIXANDO O PLAYER VISÍVEL
             */

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });


            /*
             * FINALIZAR LOADING
             */

            player.onload =
                function () {

                    loading.classList.add(
                        'hidden'
                    );

                    loading.classList.remove(
                        'flex'
                    );

                };

        }


        /*
         * ============================================================
         * MOSTRAR LISTA DE CANAIS
         * ============================================================
         */

        function showChannelsSection() {

            const channelsSection =
                document.getElementById(
                    'channelsSection'
                );


            if (channelsSection) {

                channelsSection.classList.remove(
                    'hidden'
                );

            }

        }


        /*
         * ============================================================
         * SIDEBAR
         * ============================================================
         */

        function toggleSidebar() {

            const sidebar =
                document.getElementById(
                    'sidebar'
                );


            sidebar.classList.toggle(
                '-translate-x-full'
            );

        }


        document
            .getElementById(
                'sidebarToggle'
            )
            .addEventListener(
                'click',
                toggleSidebar
            );


        document
            .getElementById(
                'closeSidebar'
            )
            .addEventListener(
                'click',
                () => {

                    document
                        .getElementById(
                            'sidebar'
                        )
                        .classList.add(
                            '-translate-x-full'
                        );

                }
            );


        /*
         * ============================================================
         * BOTÃO VER CANAIS
         * ============================================================
         */

        document
            .getElementById(
                'openChannels'
            )
            .addEventListener(
                'click',
                () => {

                    showChannelsSection();

                    document
                        .getElementById(
                            'sidebar'
                        )
                        .classList.remove(
                            '-translate-x-full'
                        );

                }
            );


        /*
         * ============================================================
         * BOTÃO CANAIS DA BARRA INFERIOR
         * ============================================================
         *
         * Além de abrir o menu lateral, ele também
         * mostra novamente a lista abaixo do player.
         */

        document
            .getElementById(
                'navChannels'
            )
            .addEventListener(
                'click',
                () => {

                    showChannelsSection();

                    document
                        .getElementById(
                            'sidebar'
                        )
                        .classList.remove(
                            '-translate-x-full'
                        );

                    setTimeout(() => {

                        const channelsSection =
                            document.getElementById(
                                'channelsSection'
                            );

                        if (channelsSection) {

                            channelsSection.scrollIntoView({
                                behavior: 'smooth',
                                block: 'start'
                            });

                        }

                    }, 100);

                }
            );


        /*
         * ============================================================
         * BUSCA
         * ============================================================
         */

        const searchInput =
            document.getElementById(
                'searchInput'
            );


        const mobileSearch =
            document.getElementById(
                'mobileSearch'
            );


        const clearSearch =
            document.getElementById(
                'clearSearch'
            );


        function toggleSearch() {

            mobileSearch.classList.toggle(
                'hidden'
            );


            if (
                !mobileSearch
                    .classList
                    .contains('hidden')
            ) {

                searchInput.focus();

            }

        }


        document
            .getElementById(
                'searchButton'
            )
            .addEventListener(
                'click',
                toggleSearch
            );


        document
            .getElementById(
                'navSearch'
            )
            .addEventListener(
                'click',
                toggleSearch
            );


        searchInput.addEventListener(
            'input',
            event => {

                searchQuery =
                    event.target.value;


                if (
                    searchQuery.trim() !== ''
                ) {

                    clearSearch.classList.remove(
                        'hidden'
                    );

                } else {

                    clearSearch.classList.add(
                        'hidden'
                    );

                }


                renderChannels();

            }
        );


        clearSearch.addEventListener(
            'click',
            () => {

                searchInput.value = '';

                searchQuery = '';

                clearSearch.classList.add(
                    'hidden'
                );

                renderChannels();

            }
        );


        /*
         * ============================================================
         * TELA CHEIA
         * ============================================================
         */

        document
            .getElementById(
                'fullscreenPlayer'
            )
            .addEventListener(
                'click',
                () => {

                    const wrapper =
                        document.getElementById(
                            'playerWrapper'
                        );


                    if (
                        wrapper.requestFullscreen
                    ) {

                        wrapper.requestFullscreen();

                    } else if (
                        wrapper.webkitRequestFullscreen
                    ) {

                        wrapper.webkitRequestFullscreen();

                    }

                }
            );


        /*
         * ============================================================
         * HOME
         * ============================================================
         */

        document
            .getElementById(
                'navHome'
            )
            .addEventListener(
                'click',
                () => {

                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });

                }
            );


        /*
         * ============================================================
         * CONFIGURAÇÕES
         * ============================================================
         */

        document
            .getElementById(
                'navSettings'
            )
            .addEventListener(
                'click',
                () => {

                    document
                        .getElementById(
                            'sidebar'
                        )
                        .classList.remove(
                            '-translate-x-full'
                        );

                }
            );


        /*
         * ============================================================
         * INICIALIZAÇÃO
         * ============================================================
         */

        window.addEventListener(
            'DOMContentLoaded',
            () => {

                loadChannelData();

            }
        );

    </script>

</body>
</html>
