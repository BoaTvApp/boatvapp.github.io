<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>BOA.TV</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:FILL@0..1&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',

            theme: {
                extend: {
                    colors: {
                        background: '#0c1324',
                        surface: '#0c1324',
                        surfacePanel: '#0f172a',
                        surfaceContainer: '#191f31',
                        surfaceHigh: '#23293c',
                        surfaceHighest: '#2e3447',

                        primary: '#adc6ff',
                        primaryContainer: '#4d8eff',

                        secondary: '#c0c1ff',
                        tertiary: '#4edea3',

                        textPrimary: '#f1f5f9',
                        textSecondary: '#94a3b8',
                        textMuted: '#64748b',

                        borderMuted: '#1e293b'
                    },

                    borderRadius: {
                        xl: '0.75rem',
                        '2xl': '1rem'
                    }
                }
            }
        }
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            background: #0c1324;
            color: #dce1fb;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }


        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';

            font-weight: normal;
            font-style: normal;

            font-size: 24px;
            line-height: 1;

            letter-spacing: normal;
            text-transform: none;

            display: inline-block;

            white-space: nowrap;
            word-wrap: normal;

            direction: ltr;

            font-feature-settings: 'liga';

            -webkit-font-feature-settings: 'liga';

            -webkit-font-smoothing: antialiased;
        }


        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }


        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }


        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }


        ::-webkit-scrollbar-track {
            background: #0c1324;
        }


        ::-webkit-scrollbar-thumb {
            background: #2e3447;
            border-radius: 10px;
        }


        .glass {
            background: rgba(15, 23, 42, 0.72);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }


        .channel-card {
            transition:
                transform .18s ease,
                background .18s ease,
                border-color .18s ease;
        }


        .channel-card:hover {
            transform: translateY(-2px);

            background: #23293c;

            border-color: rgba(173,198,255,.25);
        }


        .channel-card:active {
            transform: scale(.97);
        }


        .category-btn {
            transition: all .2s ease;
        }


        .category-btn.active {
            background: #adc6ff;
            color: #0c1324;
        }


        .bottom-nav {
            padding-bottom: env(safe-area-inset-bottom);
        }


        #videoPlayer {
            background: #000;
        }


        .player-glow {
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }

    </style>

</head>


<body class="pb-24">


    <!-- ============================================================
         CABEÇALHO
         ============================================================ -->

    <header
        class="fixed top-0 left-0 right-0 z-50 h-16 glass border-b border-white/5 flex items-center justify-center px-4">

        <div
            class="font-extrabold tracking-[0.15em] text-primary italic text-lg">

            BOA.TV

        </div>

    </header>


    <!-- ============================================================
         BUSCA
         ============================================================ -->

    <div
        id="mobileSearch"
        class="fixed top-16 left-0 right-0 z-40 hidden glass border-b border-white/5 p-3">

        <div class="relative">

            <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-textSecondary">

                search

            </span>


            <input
                id="searchInput"
                type="text"
                placeholder="Buscar canal..."
                class="w-full bg-surfacePanel border border-white/10 rounded-xl pl-11 pr-4 py-3 text-sm text-white outline-none focus:border-primary">

        </div>

    </div>


    <!-- ============================================================
         CONTEÚDO PRINCIPAL
         ============================================================ -->

    <main
        id="main-content"
        class="pt-16 min-h-screen">


        <!-- ========================================================
             PLAYER

             IMPORTANTE:
             A seção começa com "hidden".
             Portanto, o player NÃO aparece quando a página abre.

             Ela será exibida somente depois que um canal for
             selecionado.
             ======================================================== -->

        <section
            id="playerSection"
            class="relative w-full px-4 pt-4 hidden">


            <div
                id="playerWrapper"
                class="relative w-full max-w-6xl mx-auto aspect-video bg-black rounded-2xl overflow-hidden border border-white/10 player-glow">


                <!-- PLAYER -->

                <iframe
                    id="videoPlayer"
                    class="w-full h-full border-0"
                    allowfullscreen
                    allow="autoplay; encrypted-media">
                </iframe>


                <!-- LOADING -->

                <div
                    id="playerLoading"
                    class="absolute inset-0 hidden items-center justify-center bg-black/70">

                    <div class="text-center">

                        <span
                            class="material-symbols-outlined text-primary text-4xl animate-spin">

                            progress_activity

                        </span>


                        <p
                            class="text-[10px] uppercase tracking-widest text-primary mt-3">

                            Carregando transmissão

                        </p>

                    </div>

                </div>

            </div>


            <!-- ====================================================
                 INFORMAÇÕES DO CANAL
                 ==================================================== -->

            <div
                id="nowPlaying"
                class="w-full max-w-6xl mx-auto mt-3 bg-surfaceContainer rounded-xl border border-white/5 p-3">

                <div
                    class="flex items-center gap-3">


                    <img
                        id="currentLogo"
                        src=""
                        alt=""
                        class="w-12 h-12 rounded-lg object-contain bg-surfacePanel border border-white/5 p-1">


                    <div
                        class="flex-1 min-w-0">

                        <p
                            class="text-[9px] uppercase tracking-[.15em] text-textMuted">

                            Assistindo agora

                        </p>


                        <h2
                            id="currentTitle"
                            class="font-bold text-white truncate mt-1">

                            Nome do Canal

                        </h2>


                        <p
                            id="currentCategory"
                            class="text-[10px] text-primary mt-1">

                            Categoria

                        </p>

                    </div>

                </div>

            </div>

        </section>


        <!-- ========================================================
             LISTA DE CANAIS

             A lista começa visível.

             Quando um canal é selecionado:
             - player aparece
             - lista desaparece
             ======================================================== -->

        <section
            id="channelsSection"
            class="mt-8 px-4">


            <div
                class="max-w-6xl mx-auto">


                <!-- TÍTULO -->

                <div
                    class="flex items-end justify-between mb-4">

                    <div>

                        <p
                            class="text-[9px] uppercase tracking-[.2em] font-bold text-primary">

                            TV ao vivo

                        </p>


                        <h2
                            class="text-xl font-bold text-white mt-1">

                            Canais

                        </h2>

                    </div>


                    <button
                        id="clearSearch"
                        class="hidden text-[10px] uppercase tracking-wider text-textSecondary">

                        Limpar

                    </button>

                </div>


                <!-- CATEGORIAS -->

                <div
                    id="categoryContainerMain"
                    class="flex gap-2 overflow-x-auto hide-scrollbar pb-3">

                </div>


                <!-- GRID DE CANAIS -->

                <div
                    id="channelsGrid"
                    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">

                </div>

            </div>

        </section>

    </main>


    <!-- ============================================================
         BARRA INFERIOR
         ============================================================ -->

    <nav
        class="bottom-nav fixed bottom-0 left-0 right-0 z-50 h-20 glass border-t border-white/5 flex items-center justify-around">


        <!-- INÍCIO -->

        <button
            id="navHome"
            onclick="window.location.href='/';"
            class="flex flex-col items-center justify-center gap-1 text-primary min-w-[64px]">

            <span
                class="material-symbols-outlined"
                style="font-variation-settings:'FILL' 1;">
                home
            </span>

            <span
                class="text-[9px] uppercase tracking-wider font-bold">
                Início
            </span>

            <span
                class="w-1 h-1 rounded-full bg-primary">
            </span>
        </button>


        <!-- ========================================================
             CANAIS

             Clique:
             - mostra
             - oculta
             - mostra
             - oculta
             ======================================================== -->

        <button
            id="navChannels"
            class="flex flex-col items-center justify-center gap-1 text-primary min-w-[64px]">

            <span
                class="material-symbols-outlined">

                live_tv

            </span>


            <span
                class="text-[9px] uppercase tracking-wider font-bold">

                Canais

            </span>


            <span
                id="navChannelsIndicator"
                class="w-1 h-1 rounded-full bg-primary">

            </span>

        </button>


        <!-- BUSCAR -->

        <button
            id="navSearch"
            class="flex flex-col items-center justify-center gap-1 text-textSecondary min-w-[64px]">

            <span
                class="material-symbols-outlined">

                search

            </span>


            <span
                class="text-[9px] uppercase tracking-wider font-bold">

                Buscar

            </span>


            <span
                class="w-1 h-1 rounded-full bg-primary opacity-0">

            </span>

        </button>


        <!-- CONFIGURAÇÕES -->

        <button
            id="navSettings"
            class="flex flex-col items-center justify-center gap-1 text-textSecondary min-w-[64px]">

            <span
                class="material-symbols-outlined">

                settings

            </span>


            <spana
                class="text-[9px] uppercase tracking-wider font-bold">

                Config

            </span>


            <span
                class="w-1 h-1 rounded-full bg-primary opacity-0">

            </span>

        </button>

    </nav>


    <!-- ============================================================
         JAVASCRIPT
         ============================================================ -->

    <script>


        let channelData = {};

        let currentActiveCategory = "ALL";

        let searchQuery = "";


        /* ============================================================
           CARREGAR CANAIS
           ============================================================ */

        async function loadChannelData() {

            try {

                const response =
                    // await fetch('canais.json');
                    await fetch('https://boatvapp.github.io/canais.json');


                if (!response.ok) {

                    throw new Error(
                        'Erro ao carregar canais.json'
                    );

                }


                channelData =
                    await response.json();


                renderCategories();

                renderChannels();


            } catch (error) {

                console.error(error);


                document.getElementById(
                    'channelsGrid'
                ).innerHTML = `

                    <div
                        class="col-span-full text-center py-12 text-red-400">

                        <span
                            class="material-symbols-outlined text-3xl mb-3">

                            error

                        </span>


                        <p class="text-sm font-semibold">

                            Erro ao carregar canais

                        </p>
                
                
                        <p
                            class="text-[10px] text-textMuted mt-2">    
                
                            Verifique se o arquivo canais.json está disponível.
                
                        </p>
                
                    </div>
                
                `;
                
            }
            
        }
    
    
        /* ============================================================
           LOGO
    
           A logo continua vindo do parâmetro "img" do link
           do próprio canal.
           ============================================================ */
    
        function getLogoFromLink(link) {
            
            try {
                
                const url =
                    new URL(
                        link,
                        window.location.href
                    );


                const img =
                    url.searchParams.get('img');


                if (img) {

                    return decodeURIComponent(img);

                }


                return 'https://via.placeholder.com/200';


            } catch (error) {

                console.warn(
                    'Não foi possível obter a logo:',
                    error
                );


                return 'https://via.placeholder.com/200';

            }

        }


        /* ============================================================
           ESCAPAR HTML
           ============================================================ */

        function escapeHTML(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        function escapeAttribute(value) {

            return escapeHTML(value);

        }


        function escapeJS(value) {

            return String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n');

        }


/* ============================================================
            CARREGAR CANAIS
            ============================================================ */

        async function loadChannelData() {

            try {

                const response = await fetch('https://embed.bugoumods.com/?api=1&t=live&c=16462,15197,15182,15183,15188,15193,15187,15186,15190,15705,15192,16324,15211,17553,15195,15180,15213,15201,15206,15208,15207,16545,15216,14868,15214,16546,16466,16514,16516,16518,16519,15707,15218,15228,15229&uid=6a825cdf96e92');


                if (!response.ok) {

                    throw new Error(
                        'Erro ao carregar os dados da API de canais'
                    );

                }


                channelData =
                    await response.json();


                renderCategories();

                renderChannels();


            } catch (error) {

                console.error(error);


                document.getElementById(
                    'channelsGrid'
                ).innerHTML = `

                    <div
                        class="col-span-full text-center py-12 text-red-400">

                        <span
                            class="material-symbols-outlined text-3xl mb-3">

                            error

                        </span>


                        <p class="text-sm font-semibold">

                            Erro ao carregar canais

                        </p>
                
                
                        <p
                            class="text-[10px] text-textMuted mt-2">    
                
                            Verifique a conexão ou se o link da API está funcional.
                
                        </p>
                
                    </div>
                
                `;
                
            }
            
        }


        /* ============================================================
           RENDERIZAR CANAIS
           ============================================================ */

        function renderChannels() {

            const grid =
                document.getElementById(
                    'channelsGrid'
                );


            let channels = [];


            if (
                currentActiveCategory === 'ALL'
            ) {

                Object.values(channelData)
                    .forEach(group => {

                        channels =
                            channels.concat(group);

                    });

            } else {

                channels =
                    channelData[
                        currentActiveCategory
                    ] || [];

            }


            /* BUSCA */

            if (
                searchQuery.trim() !== ''
            ) {

                const query =
                    searchQuery
                        .toLowerCase();


                channels =
                    channels.filter(channel => {

                        return (
                            channel.nome &&
                            channel.nome
                                .toLowerCase()
                                .includes(query)
                        );

                    });

            }


            /* NENHUM RESULTADO */

            if (
                channels.length === 0
            ) {

                grid.innerHTML = `

                    <div
                        class="col-span-full text-center py-12 text-textMuted">

                        <span
                            class="material-symbols-outlined text-3xl mb-3">

                            search_off

                        </span>


                        <p class="text-xs">

                            Nenhum canal encontrado

                        </p>

                    </div>

                `;

                return;

            }


            let html = '';


            channels.forEach(channel => {

                const logo =
                    getLogoFromLink(
                        channel.link
                    );


                html += `

                    <div
                        onclick="playChannel(
                            '${escapeJS(channel.link)}',
                            '${escapeJS(channel.nome)}',
                            '${escapeJS(channel.categoria)}'
                        )"
                        class="channel-card cursor-pointer">


                        <div
                            class="relative aspect-square rounded-xl overflow-hidden
                                   bg-surfaceContainer border border-white/5">


                            <img
                                src="${escapeAttribute(logo)}"
                                alt="${escapeAttribute(channel.nome)}"
                                loading="lazy"
                                class="w-full h-full object-contain p-4"
                                onerror="this.src='https://via.placeholder.com/200'">


                            <div
                                class="absolute inset-x-0 bottom-0 p-2
                                       bg-gradient-to-t from-black/80 to-transparent">


                                <p
                                    class="text-[10px] font-bold text-white truncate">

                                    ${escapeHTML(channel.nome)}

                                </p>


                                <p
                                    class="text-[8px] text-white/60 truncate mt-1">

                                    ${escapeHTML(channel.categoria || '')}

                                </p>

                            </div>


                            <div
                                class="absolute top-2 right-2 w-7 h-7 rounded-full
                                       bg-black/50 backdrop-blur-sm
                                       flex items-center justify-center">


                                <span
                                    class="material-symbols-outlined text-sm text-primary">

                                    play_arrow

                                </span>

                            </div>

                        </div>

                    </div>

                `;

            });


            grid.innerHTML = html;

        }


        /* ============================================================
           FILTRAR CATEGORIA
           ============================================================ */

        function filterCategory(category) {

            currentActiveCategory =
                category;


            renderCategories();

            renderChannels();

        }


        /* ============================================================
           REPRODUZIR CANAL
           ============================================================ */

        function playChannel(
            link,
            name,
            categoria
        ) {

            const playerSection =
                document.getElementById(
                    'playerSection'
                );


            const player =
                document.getElementById(
                    'videoPlayer'
                );


            const channelsSection =
                document.getElementById(
                    'channelsSection'
                );


            const nowPlaying =
                document.getElementById(
                    'nowPlaying'
                );


            const currentTitle =
                document.getElementById(
                    'currentTitle'
                );


            const currentLogo =
                document.getElementById(
                    'currentLogo'
                );


            const currentCategory =
                document.getElementById(
                    'currentCategory'
                );


            const loading =
                document.getElementById(
                    'playerLoading'
                );


            /*
             * ========================================================
             * AGORA O PLAYER SÓ É MOSTRADO AQUI.
             *
             * Antes de selecionar o canal, playerSection possui
             * a classe "hidden".
             * ========================================================
             */

            playerSection.classList.remove(
                'hidden'
            );


            /*
             * Mostra loading
             */

            loading.classList.remove(
                'hidden'
            );


            loading.classList.add(
                'flex'
            );


            /*
             * Define o canal
             */

            player.src =
                link;


            /*
             * Informações do canal
             */

            currentTitle.textContent =
                name;


            currentLogo.src =
                getLogoFromLink(link);


            currentCategory.textContent =
                categoria || '';


            nowPlaying.classList.remove(
                'hidden'
            );


            /*
             * ========================================================
             * OCULTA A LISTA DE CANAIS
             * ========================================================
             */

            channelsSection.classList.add(
                'hidden'
            );


            /*
             * Atualiza botão Canais
             */

            updateChannelsButton();


            /*
             * Vai para o player
             */

            setTimeout(() => {

                playerSection.scrollIntoView({

                    behavior: 'smooth',

                    block: 'start'

                });

            }, 100);


            /*
             * Remove loading quando o iframe carregar
             */

            player.onload =
                function () {

                    loading.classList.add(
                        'hidden'
                    );


                    loading.classList.remove(
                        'flex'
                    );

                };

        }


        /* ============================================================
           MOSTRAR / OCULTAR CANAIS
           ============================================================ */

        function toggleChannelsSection() {

            const channelsSection =
                document.getElementById(
                    'channelsSection'
                );


            if (!channelsSection) {

                return;

            }


            /*
             * Alterna:
             *
             * hidden -> visível
             * visível -> hidden
             */

            channelsSection.classList.toggle(
                'hidden'
            );


            updateChannelsButton();


            /*
             * Se acabou de mostrar a lista,
             * leva até ela.
             */

            if (
                !channelsSection
                    .classList
                    .contains('hidden')
            ) {

                setTimeout(() => {

                    channelsSection.scrollIntoView({

                        behavior: 'smooth',

                        block: 'start'

                    });

                }, 100);

            }

        }


        /* ============================================================
           ESTADO VISUAL DO BOTÃO CANAIS
           ============================================================ */

        function updateChannelsButton() {

            const channelsSection =
                document.getElementById(
                    'channelsSection'
                );


            const button =
                document.getElementById(
                    'navChannels'
                );


            const indicator =
                document.getElementById(
                    'navChannelsIndicator'
                );


            if (
                !channelsSection ||
                !button ||
                !indicator
            ) {

                return;

            }


            const visible =
                !channelsSection
                    .classList
                    .contains('hidden');


            if (visible) {

                button.classList.remove(
                    'text-textSecondary'
                );


                button.classList.add(
                    'text-primary'
                );


                indicator.classList.remove(
                    'opacity-0'
                );


                indicator.classList.add(
                    'opacity-100'
                );

            } else {

                button.classList.remove(
                    'text-primary'
                );


                button.classList.add(
                    'text-textSecondary'
                );


                indicator.classList.remove(
                    'opacity-100'
                );


                indicator.classList.add(
                    'opacity-0'
                );

            }

        }


        /* ============================================================
           BOTÃO CANAIS
           ============================================================ */

        document
            .getElementById(
                'navChannels'
            )
            .addEventListener(
                'click',
                () => {

                    toggleChannelsSection();

                }
            );


        /* ============================================================
           BUSCA
           ============================================================ */

        const searchInput =
            document.getElementById(
                'searchInput'
            );


        const mobileSearch =
            document.getElementById(
                'mobileSearch'
            );


        const clearSearch =
            document.getElementById(
                'clearSearch'
            );


        function toggleSearch() {

            mobileSearch.classList.toggle(
                'hidden'
            );


            if (
                !mobileSearch
                    .classList
                    .contains('hidden')
            ) {

                searchInput.focus();

            }

        }


        document
            .getElementById(
                'navSearch'
            )
            .addEventListener(
                'click',
                toggleSearch
            );


        searchInput.addEventListener(
            'input',
            event => {

                searchQuery =
                    event.target.value;


                if (
                    searchQuery.trim() !== ''
                ) {

                    clearSearch.classList.remove(
                        'hidden'
                    );

                } else {

                    clearSearch.classList.add(
                        'hidden'
                    );

                }


                /*
                 * Se estiver pesquisando,
                 * mostra a lista.
                 */

                const channelsSection =
                    document.getElementById(
                        'channelsSection'
                    );


                channelsSection.classList.remove(
                    'hidden'
                );


                updateChannelsButton();

                renderChannels();

            }
        );


        clearSearch.addEventListener(
            'click',
            () => {

                searchInput.value = '';

                searchQuery = '';


                clearSearch.classList.add(
                    'hidden'
                );

                
                renderChannels();
                
            }
        );


        /* ============================================================
           INÍCIO
           ============================================================ */

        document
            .getElementById(
                'navHome'
            )
            .addEventListener(
                'click',
                () => {

                    window.scrollTo({

                        top: 0,

                        behavior: 'smooth'

                    });

                }
            );


        /* ============================================================
           CONFIGURAÇÕES
           ============================================================ */

        document
            .getElementById(
                'navSettings'
            )
            .addEventListener(
                'click',
                () => {

                    console.log(
                        'Configurações'
                    );

                }
            );


        /* ============================================================
           INICIALIZAÇÃO
           ============================================================ */

        window.addEventListener(
            'DOMContentLoaded',
            () => {

                loadChannelData();

                updateChannelsButton();

            }
        );

    </script>

</body>

</html>
