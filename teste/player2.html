<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IPTV Player - API BugouMods</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden">

    <!-- Cabeçalho -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold flex items-center">
            <i class="fas fa-tv text-red-500 mr-2"></i> Web IPTV Player
        </h1>
        <div class="flex items-center space-x-4">
            <!-- Barra de Pesquisa -->
            <div class="relative">
                <input type="text" id="search-input" placeholder="Buscar canal..." class="bg-gray-700 text-sm rounded-lg px-3 py-1.5 pl-8 focus:outline-none focus:ring-2 focus:ring-red-500 w-48 md:w-64">
                <i class="fas fa-search absolute left-2.5 top-2.5 text-gray-400 text-xs"></i>
            </div>
            <span class="text-sm text-gray-400 hidden md:inline">Status: <span id="status-text" class="text-yellow-400 font-semibold">Carregando canais...</span></span>
        </div>
    </header>

    <!-- Corpo Principal -->
    <div class="flex flex-1 overflow-hidden">

        <!-- Área do Player -->
        <div class="flex-1 bg-black flex items-center justify-center relative">
            <iframe id="video-player" class="w-full h-full border-0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            <div id="placeholder" class="absolute text-gray-500 flex flex-col items-center p-6 text-center">
                <i class="fas fa-film text-6xl mb-3 text-gray-600"></i>
                <p class="text-lg font-medium text-gray-400">Selecione um canal na lista ao lado para começar</p>
                <p class="text-xs text-gray-500 mt-1">Os canais são carregados diretamente da API.</p>
            </div>
        </div>

        <!-- Lista de Canais -->
        <div class="w-80 md:w-96 bg-gray-800 border-l border-gray-700 flex flex-col">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <div>
                    <h2 class="font-semibold text-lg text-gray-200">Lista de Canais</h2>
                    <p class="text-xs text-gray-400" id="channel-count">Carregando...</p>
                </div>
                <button id="refresh-btn" onclick="fetchChannels()" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-gray-700 transition" title="Atualizar Lista">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>

            <!-- Filtro de Categorias -->
            <div id="category-filter-container" class="px-3 py-2 border-b border-gray-700 overflow-x-auto whitespace-nowrap hidden space-x-1">
                <!-- Categorias injetadas dinamicamente -->
            </div>

            <div id="channel-list" class="overflow-y-auto flex-1 p-2 space-y-2">
                <!-- Os canais serão injetados aqui -->
            </div>
        </div>

    </div>

    <script>
        // URL da API direta
        const apiUrl = "https://embed.bugoumods.com/?api=1&t=live&c=15193&uid=6a825cdf96e92";

        const channelListContainer = document.getElementById('channel-list');
        const videoPlayer = document.getElementById('video-player');
        const placeholder = document.getElementById('placeholder');
        const statusText = document.getElementById('status-text');
        const channelCount = document.getElementById('channel-count');
        const searchInput = document.getElementById('search-input');
        const categoryFilterContainer = document.getElementById('category-filter-container');

        let allChannels = [];
        let selectedCategory = 'Todas';

        async function fetchChannels() {
            statusText.innerText = "Carregando canais...";
            statusText.className = "text-yellow-400 font-semibold";
            channelCount.innerText = "Carregando...";
            channelListContainer.innerHTML = `
                <div class="p-6 text-center text-gray-400 text-sm">
                    <i class="fas fa-spinner fa-spin mb-2 text-2xl text-red-500"></i><br>
                    Buscando canais diretamente...
                </div>`;

            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const rawText = await response.text();
                let data;
                
                try {
                    data = JSON.parse(rawText);
                } catch (e) {
                    throw new Error("A resposta da API não está em formato JSON válido.");
                }

                // Tratamento e normalização robusta dos dados recebidos
                if (Array.isArray(data)) {
                    allChannels = data;
                } else if (data && typeof data === 'object') {
                    // Se retornar um objeto contendo uma lista interna
                    allChannels = data.channels || data.data || data.result || Object.values(data);
                    if (!Array.isArray(allChannels)) {
                        allChannels = [];
                    }
                } else {
                    allChannels = [];
                }

                if (allChannels.length > 0) {
                    buildCategories(allChannels);
                    filterAndRenderChannels();
                    channelCount.innerText = `${allChannels.length} canais encontrados`;
                    statusText.innerText = "Pronto";
                    statusText.className = "text-green-400 font-semibold";
                } else {
                    channelCount.innerText = "Nenhum canal encontrado";
                    statusText.innerText = "Lista vazia";
                    statusText.className = "text-yellow-400 font-semibold";
                    channelListContainer.innerHTML = `
                        <div class="p-6 text-center text-yellow-400 text-sm">
                            <i class="fas fa-exclamation-circle mb-2 text-2xl"></i><br>
                            A API respondeu, mas nenhum canal foi retornado.
                        </div>`;
                }
            } catch (error) {
                console.error("Erro ao carregar a API:", error);
                channelListContainer.innerHTML = `
                    <div class="p-4 text-center text-red-400 text-sm">
                        <i class="fas fa-exclamation-triangle mb-2 text-2xl"></i><br>
                        Falha ao conectar com a API diretamente.<br>
                        <span class="text-xs text-gray-400 mt-1 block">Verifique o console para detalhes ou restrições de CORS do navegador.</span>
                    </div>`;
                statusText.innerText = "Erro de Conexão";
                statusText.className = "text-red-400 font-semibold";
                channelCount.innerText = "Erro";
            }
        }

        function buildCategories(channels) {
            const categoriesSet = new Set();
            channels.forEach(ch => {
                if (ch.categoria && typeof ch.categoria === 'string') {
                    categoriesSet.add(ch.categoria.trim());
                } else {
                    categoriesSet.add('Geral');
                }
            });

            const categories = ['Todas', ...Array.from(categoriesSet)];
            
            if (categories.length > 1) {
                categoryFilterContainer.innerHTML = '';
                categoryFilterContainer.classList.remove('hidden');

                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = `px-3 py-1 rounded-full text-xs font-medium transition inline-block mr-1 ${selectedCategory === cat ? 'bg-red-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`;
                    btn.innerText = cat;
                    btn.onclick = () => {
                        selectedCategory = cat;
                        buildCategories(allChannels); // atualizar estados visuais dos botões
                        filterAndRenderChannels();
                    };
                    categoryFilterContainer.appendChild(btn);
                });
            } else {
                categoryFilterContainer.classList.add('hidden');
            }
        }

        function filterAndRenderChannels() {
            const searchTerm = searchInput.value.toLowerCase().trim();

            const filtered = allChannels.filter(channel => {
                const name = (channel.nome || channel.title || channel.name || '').toLowerCase();
                const category = (channel.categoria || channel.category || 'Geral').toLowerCase();
                
                const matchesSearch = name.includes(searchTerm) || category.includes(searchTerm);
                const matchesCategory = selectedCategory === 'Todas' || (channel.categoria && channel.categoria.trim() === selectedCategory);

                return matchesSearch && matchesCategory;
            });

            renderChannelsList(filtered);
        }

        function renderChannelsList(channels) {
            channelListContainer.innerHTML = '';

            if (channels.length === 0) {
                channelListContainer.innerHTML = `
                    <div class="p-6 text-center text-gray-400 text-sm">
                        <i class="fas fa-search mb-2 text-2xl"></i><br>
                        Nenhum canal corresponde à sua busca.
                    </div>`;
                return;
            }

            channels.forEach((channel) => {
                const channelName = channel.nome || channel.title || channel.name || 'Canal sem nome';
                const channelCategory = channel.categoria || channel.category || 'Geral';
                const channelLogo = channel.capa || channel.logo || channel.image || '';

                const button = document.createElement('button');
                button.className = "w-full text-left p-2.5 rounded-lg bg-gray-700 hover:bg-red-600 transition flex items-center space-x-3 group cursor-pointer";

                const logoHtml = channelLogo 
                    ? `<img src="${channelLogo}" class="w-8 h-8 object-contain rounded bg-gray-900 p-0.5" onerror="this.onerror=null; this.src='https://placehold.co/32x32/1f2937/9ca3af?text=TV'">` 
                    : '<i class="fas fa-tv text-gray-400 w-8 text-center"></i>';

                button.innerHTML = `
                    ${logoHtml}
                    <div class="flex-1 truncate">
                        <span class="font-medium text-sm block truncate text-gray-200 group-hover:text-white">${escapeHtml(channelName)}</span>
                        <span class="text-xs text-gray-400 group-hover:text-gray-200">${escapeHtml(channelCategory)}</span>
                    </div>
                    <i class="fas fa-play text-xs text-gray-400 group-hover:text-white"></i>
                `;

                button.onclick = () => playChannel(channel, button);
                channelListContainer.appendChild(button);
            });
        }

        function playChannel(channel, element) {
            document.querySelectorAll('#channel-list button').forEach(btn => {
                btn.classList.remove('bg-red-600');
                btn.classList.add('bg-gray-700');
            });

            element.classList.remove('bg-gray-700');
            element.classList.add('bg-red-600');

            const streamLink = channel.link || channel.url || channel.stream_url;

            placeholder.style.display = 'none';
            if (streamLink) {
                videoPlayer.src = streamLink;
                const channelName = channel.nome || channel.title || channel.name || 'Canal';
                statusText.innerText = `Reproduzindo: ${channelName}`;
                statusText.className = "text-green-400 font-semibold";
            } else {
                statusText.innerText = "Link indisponível para este canal";
                statusText.className = "text-red-400 font-semibold";
            }
        }

        // Utilitário para segurança de strings HTML
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Event listener para a barra de pesquisa em tempo real
        searchInput.addEventListener('input', filterAndRenderChannels);

        // Inicialização ao carregar a página
        fetchChannels();
    </script>
</body>
</html>
