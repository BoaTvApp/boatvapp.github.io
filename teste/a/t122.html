<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <header class="bg-cardBg border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-md flex items-center justify-between">

            </h1>
        </div>
        <div class="relative w-48 md:w-72">

                <i class="fa-solid fa-search"></i>

        </div>

    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- SIDEBAR / CHANNEL MENU -->
        <aside id="sidebar" class="w-80 bg-cardBg border-r border-slate-800 flex flex-col transition-all duration-300 z-40 absolute md:relative inset-y-0 left-0 transform -translate-x-full md:translate-x-0">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between">
                <span class="font-semibold text-sm uppercase tracking-wider text-slate-400 flex items-center gap-2">
                    <i class="fa-solid fa-list"></i> Menu Canais
                </span>
                <button id="closeSidebar" class="md:hidden text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <!-- Category Pills / Selector -->
            <div id="categoryContainer" class="flex gap-1.5 p-2 overflow-x-auto border-b border-slate-800 bg-slate-900/50 flex-shrink-0">
                <!-- Dynamically populated categories -->
            </div>
            <!-- Channels List Container -->
            <div id="channelsList" class="flex-1 overflow-y-auto p-2 space-y-1.5">
                <!-- Dynamically populated channel items -->
            </div>
        </aside>

        <!-- MAIN CONTENT / VIDEO PLAYER AREA -->
        <main class="flex-1 flex flex-col bg-darkBg overflow-hidden">
            <div class="flex-1 flex flex-col items-center justify-center p-4">
                <div id="playerWrapper" class="w-full max-w-5xl aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800 relative flex items-center justify-center">
                    <!-- Default State Message -->
                    <div id="playerPlaceholder" class="text-center p-6 text-slate-500 flex flex-col items-center justify-center">
                        <i class="fa-solid fa-clapperboard text-5xl mb-3 text-slate-600 animate-pulse"></i>
                        <p class="text-base font-medium">Selecione um canal ao lado para iniciar a transmissão</p>
                    </div>
                    <!-- Embed iframe player -->
                    <iframe id="videoPlayer" class="w-full h-full border-0 hidden" allowfullscreen allow="autoplay; encrypted-media"></iframe>
                </div>
                <!-- Current Playing Banner -->
                <div id="nowPlaying" class="w-full max-w-5xl mt-4 bg-cardBg border border-slate-800 rounded-lg p-4 flex items-center justify-between hidden">
                    <div class="flex items-center space-x-3">
                        <img id="currentLogo" src="" alt="" class="w-10 h-10 object-contain bg-slate-900 rounded p-1 border border-slate-700">
                        <div>
                            <h3 id="currentTitle" class="font-semibold text-slate-100">Nome do Canal</h3>
                            <span id="currentCategory" class="text-xs text-accent font-medium">Categoria</span>
                        </div>
                    </div>
                    <button id="fullscreenPlayer" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded text-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-expand"></i> Tela Cheia
                    </button>
                </div>
            </div>
        </main>
    </div>

        let currentActiveCategory = "ALL";
        let searchQuery = "";

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            const categories = Object.keys(channelData);
            
            let html = `<button onclick="filterCategory('ALL')" class="category-btn px-3 py-1.5 text-xs font-semibold rounded-lg transition whitespace-nowrap ${currentActiveCategory === 'ALL' ? 'bg-accent text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">TODOS</button>`;
            
            categories.forEach(cat => {
                const isActive = currentActiveCategory === cat;
                html += `<button onclick="filterCategory('${cat}')" class="category-btn px-3 py-1.5 text-xs font-semibold rounded-lg transition whitespace-nowrap ${isActive ? 'bg-accent text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${cat}</button>`;
            });
            
            container.innerHTML = html;
        }

        function renderChannels() {
            const listContainer = document.getElementById('channelsList');
            let matchedChannels = [];

            if (currentActiveCategory === 'ALL') {
                Object.values(channelData).forEach(group => {
                    matchedChannels = matchedChannels.concat(group);
                });
            } else {
                matchedChannels = channelData[currentActiveCategory] || [];
            }

            // Filter by search input
            if (searchQuery.trim() !== '') {
                const query = searchQuery.toLowerCase();
                matchedChannels = matchedChannels.filter(ch => ch.nome.toLowerCase().includes(query));
            }

            if (matchedChannels.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Nenhum canal encontrado</div>`;
                return;
            }

            let html = '';
            matchedChannels.forEach(ch => {
                const safeImg = ch.capa ? ch.capa : 'https://via.placeholder.com/40';
                html += `
                    <div onclick="playChannel('${ch.link}', '${ch.nome.replace(/'/g, "\\'")}', '${safeImg}', '${ch.categoria}')" 
                         class="flex items-center space-x-3 p-2 rounded-lg bg-slate-900/40 hover:bg-slate-800/80 cursor-pointer transition border border-slate-800/50 group">
                        <div class="w-10 h-10 bg-slate-900 rounded flex items-center justify-center p-1 flex-shrink-0 border border-slate-700/50">
                            <img src="${safeImg}" alt="" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/40'">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-medium text-slate-200 group-hover:text-accent truncate">${ch.nome}</h4>
                            <span class="text-[10px] text-slate-500 block truncate">${ch.categoria}</span>
                        </div>
                        <i class="fa-solid fa-play text-xs text-slate-600 group-hover:text-accent pr-1"></i>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
        }

        function filterCategory(category) {
            currentActiveCategory = category;
            renderCategories();
            renderChannels();
        }

        function playChannel(link, name, capa, categoria) {
            const player = document.getElementById('videoPlayer');
            const placeholder = document.getElementById('playerPlaceholder');
            const nowPlaying = document.getElementById('nowPlaying');
            const currentTitle = document.getElementById('currentTitle');
            const currentLogo = document.getElementById('currentLogo');
            const currentCategory = document.getElementById('currentCategory');

            placeholder.classList.add('hidden');
            player.classList.remove('hidden');
            player.src = link;

            currentTitle.textContent = name;
            currentLogo.src = capa;
            currentCategory.textContent = categoria;
            nowPlaying.classList.remove('hidden');

            // On mobile, auto-close sidebar when channel is selected
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        // Event Listeners for UI interaction
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderChannels();
        });

        document.getElementById('sidebarToggle').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        });

        document.getElementById('closeSidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('-translate-x-full');
        });

        document.getElementById('fullscreenPlayer').addEventListener('click', () => {
            const wrapper = document.getElementById('playerWrapper');
            if (wrapper.requestFullscreen) {
                wrapper.requestFullscreen();
            } else if (wrapper.webkitRequestFullscreen) {
                wrapper.webkitRequestFullscreen();
            }
        });

        // Initialize App on load
        window.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            renderChannels();
        });
    </script>
</body>
</html>
