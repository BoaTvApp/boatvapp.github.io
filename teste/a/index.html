                if (dadosCanais.hasOwnProperty(categoria)) {
                    // Cria o cabeçalho da categoria
                    const tituloCategoria = document.createElement('li');
                    tituloCategoria.className = 'categoria';
                    tituloCategoria.textContent = categoria;
                    menuCanais.appendChild(tituloCategoria);

                    // Adiciona cada canal listado na categoria
                    dadosCanais[categoria].forEach(canal => {
                        const itemLista = document.createElement('li');
                        itemLista.textContent = canal.nome;
                        menuCanais.appendChild(itemLista);
                    });
                }
            }
        }

        // Executa a montagem ao carregar a página
        renderizarMenu();
